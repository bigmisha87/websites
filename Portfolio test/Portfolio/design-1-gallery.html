<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MISHA Graphics · גלריה</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@200;300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: oklch(0.985 0.004 90);
    --bg2: oklch(0.965 0.005 90);
    --ink: oklch(0.18 0.01 70);
    --ink-soft: oklch(0.46 0.01 70);
    --line: oklch(0.88 0.005 90);
    --accent: oklch(0.55 0.02 70);
    --maxw: 1320px;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{font-family:'Assistant',system-ui,sans-serif; background:var(--bg); color:var(--ink); -webkit-font-smoothing:antialiased; line-height:1.6; overflow-x:hidden}
  ::selection{background:var(--ink); color:var(--bg)}
  img{display:block}
  .wrap{max-width:var(--maxw); margin:0 auto; padding:0 clamp(20px,5vw,64px)}

  /* NAV */
  nav{position:fixed; inset:0 0 auto 0; z-index:50; display:flex; align-items:center; justify-content:space-between; padding:14px clamp(20px,5vw,64px); backdrop-filter:blur(12px); background:color-mix(in oklab, var(--bg) 74%, transparent); border-bottom:1px solid transparent; transition:border-color .3s}
  nav.scrolled{border-color:var(--line)}
  .logo-mark{height:38px; mix-blend-mode:multiply; cursor:pointer}
  .brandwrap{display:flex; align-items:center; gap:13px}
  .design-switch{position:relative}
  .design-name{font-size:13px; font-weight:600; color:var(--ink-soft); letter-spacing:.03em; padding-inline-start:13px; border-inline-start:1px solid var(--line); display:inline-flex; align-items:center; gap:7px; cursor:pointer; background:none; border-top:none; border-bottom:none; border-right:none; font-family:inherit}
  .design-name:hover{color:var(--ink)}
  .ds-caret{font-size:9px; transition:transform .25s}
  .design-switch.open .ds-caret{transform:rotate(180deg)}
  .ds-menu{position:absolute; top:calc(100% + 14px); inset-inline-start:0; min-width:232px; background:#fff; border:1px solid var(--line); border-radius:14px; padding:8px; display:flex; flex-direction:column; gap:2px; opacity:0; visibility:hidden; transform:translateY(-8px); transition:opacity .24s ease, transform .24s cubic-bezier(.2,.7,.2,1); box-shadow:0 24px 54px -22px rgba(20,18,15,.4); z-index:80}
  .design-switch.open .ds-menu{opacity:1; visibility:visible; transform:none}
  .ds-menu .ds-head{font-size:11px; letter-spacing:.2em; text-transform:uppercase; color:var(--ink-soft); padding:8px 12px 5px}
  .ds-menu a{text-decoration:none; color:var(--ink); font-size:14px; font-weight:600; padding:10px 12px; border-radius:9px; display:flex; align-items:center; justify-content:space-between; gap:10px; transition:.16s}
  .ds-menu a:hover{background:var(--bg2)}
  .ds-menu a.cur{color:var(--accent)}
  .ds-menu a.cur::after{content:"●"; font-size:8px}
  .ds-menu .ds-divider{height:1px; background:var(--line); margin:6px 4px}
  .ds-menu a.home{color:var(--ink-soft); font-weight:500; font-size:13px}
  .navlinks{display:flex; gap:clamp(14px,3vw,38px); align-items:center}
  .navlinks a{color:var(--ink); text-decoration:none; font-weight:500; font-size:15px; position:relative; padding:4px 0}
  .navlinks a::after{content:""; position:absolute; bottom:0; right:0; width:0; height:1.5px; background:var(--ink); transition:width .3s}
  .navlinks a:hover::after{width:100%}
  .navlinks .home{font-size:13px; color:var(--ink-soft)}

  /* HERO */
  header.hero{min-height:86svh; display:flex; flex-direction:column; justify-content:center; padding-top:96px; padding-bottom:0; position:relative}
  .hero-grid{display:grid; grid-template-columns:1.3fr .9fr; gap:40px; align-items:end; flex:1}
  .hero-grid > div:first-child{align-self:center}
  .hero .hello{font-weight:300; font-size:clamp(19px,2.2vw,27px); color:var(--ink-soft); margin-bottom:14px}
  .hero h1{font-weight:800; font-size:clamp(38px,6vw,86px); line-height:.98; letter-spacing:-.02em; margin-bottom:20px}
  .hero .lines{font-weight:300; font-size:clamp(17px,1.6vw,22px); color:var(--ink-soft); line-height:1.6; max-width:46ch}
  .hero .lines b{color:var(--ink); font-weight:600}
  .hero .sub{margin-top:18px; font-size:clamp(16px,1.4vw,19px); font-weight:500; max-width:42ch}
  .hero-portrait{display:flex; justify-content:center; align-items:flex-end; height:100%}
  .hero-portrait img{width:100%; max-width:clamp(320px,36vw,460px); display:block}
  .scrolldown{position:absolute; bottom:28px; right:clamp(20px,5vw,64px); font-size:13px; color:var(--ink-soft); display:flex; flex-direction:column; align-items:center; gap:8px; letter-spacing:.1em}
  .scrolldown .bar{width:1px; height:46px; background:var(--line); position:relative; overflow:hidden}
  .scrolldown .bar::after{content:""; position:absolute; top:-50%; left:0; width:100%; height:50%; background:var(--ink); animation:drop 2s infinite}
  @keyframes drop{0%{top:-50%}100%{top:100%}}

  .sec{padding:clamp(44px,6vh,84px) 0; position:relative; z-index:0}
  .sec > *{position:relative; z-index:1}
  .sec::before{content:""; position:absolute; top:0; bottom:0; left:50%; transform:translateX(-50%); width:100vw; z-index:0; background:var(--tint, transparent)}
  #about{--tint:oklch(0.973 0.013 72)}
  #works{--tint:oklch(0.975 0.010 232)}
  #contact{--tint:oklch(0.968 0.016 150)}
  .kicker{font-size:13px; letter-spacing:.28em; text-transform:uppercase; color:var(--accent); font-weight:600; margin-bottom:20px}
  .sec h2{font-weight:800; font-size:clamp(30px,4.4vw,60px); line-height:1.05; letter-spacing:-.015em}

  /* ABOUT */
  #about .about-grid{display:grid; grid-template-columns:1fr 1.5fr; gap:clamp(24px,4vw,60px); align-items:start}
  #about p{font-size:clamp(16px,1.45vw,20px); color:var(--ink-soft); margin-bottom:16px; max-width:62ch; line-height:1.7}
  #about p:first-child{color:var(--ink); font-weight:500}

  /* WORKS — logo tiles */
  .works-head{display:flex; justify-content:space-between; align-items:flex-end; flex-wrap:wrap; gap:18px; margin-bottom:clamp(20px,3vh,36px)}
  .works-head .sub{color:var(--ink-soft); font-size:clamp(16px,1.4vw,20px); font-weight:300; max-width:38ch}
  .tiles{display:grid; grid-template-columns:repeat(4,1fr); gap:clamp(14px,1.6vw,24px)}
  .tile{position:relative; aspect-ratio:1/1; background:#fff; border:1px solid var(--line); border-radius:4px; cursor:pointer; overflow:hidden; transition:transform .4s cubic-bezier(.2,.7,.2,1), box-shadow .4s, border-color .3s}
  .tile:hover{transform:translateY(-6px); box-shadow:0 22px 44px -22px rgba(20,18,15,.4); border-color:var(--ink)}
  .tile .logobox{position:absolute; inset:0; display:grid; place-items:center; padding:18%}
  .tile .logobox img{max-width:100%; max-height:100%; width:auto; height:auto; object-fit:contain}
  .tile .txtlogo{display:grid; place-items:center; gap:6px; text-align:center}
  .tile .txtlogo .bn{font-weight:800; font-size:clamp(20px,2.4vw,30px); letter-spacing:-.01em}
  .tile .txtlogo .tag{font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:var(--ink-soft)}
  .tile .reveal-meta{position:absolute; inset:auto 0 0 0; background:var(--ink); color:var(--bg); padding:11px 14px; display:flex; justify-content:space-between; align-items:center; gap:8px; transform:translateY(101%); transition:.4s; font-size:13px}
  .tile:hover .reveal-meta{transform:none}
  .tile .reveal-meta .t{font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .tile .reveal-meta .n{opacity:.6; white-space:nowrap}

  /* CONTACT */
  #contact{text-align:center}
  .contact-lines{font-weight:800; font-size:clamp(30px,5.5vw,76px); line-height:1.04; letter-spacing:-.02em}
  .contact-lines .soft{color:var(--ink-soft); font-weight:300}
  .contact-actions{margin-top:32px; display:flex; gap:14px; justify-content:center; flex-wrap:wrap}
  .btn{display:inline-flex; align-items:center; gap:10px; padding:15px 30px; border-radius:100px; text-decoration:none; font-weight:600; font-size:16px; transition:.3s; border:1px solid var(--ink)}
  .btn.solid{background:var(--ink); color:var(--bg)} .btn.solid:hover{transform:translateY(-3px)}
  .btn.ghost{color:var(--ink)} .btn.ghost:hover{background:var(--ink); color:var(--bg)}

  footer{border-top:1px solid var(--line); padding:40px 0; text-align:center}
  footer .f{color:var(--ink-soft); font-weight:300; font-size:15px; max-width:50ch; margin:0 auto 14px}
  footer .c{font-size:13px; color:var(--ink-soft); letter-spacing:.05em}

  .reveal{opacity:0; transform:translateY(28px); transition:opacity .8s ease, transform .8s cubic-bezier(.2,.7,.2,1)}
  .reveal.in{opacity:1; transform:none}

  /* BRAND PAGE (overlay) */
  .brandpage{position:fixed; inset:0; z-index:100; background:var(--bg); display:none; overflow-y:auto}
  .brandpage.open{display:block; animation:fade .4s}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .bp-bar{position:sticky; top:0; z-index:3; display:flex; align-items:center; justify-content:space-between; padding:14px clamp(20px,5vw,64px); background:color-mix(in oklab,var(--bg) 80%,transparent); backdrop-filter:blur(10px); border-bottom:1px solid var(--line)}
  .bp-bar .ml{height:34px; mix-blend-mode:multiply}
  .bp-close{width:46px; height:46px; border-radius:50%; border:1px solid var(--line); background:none; cursor:pointer; position:relative; transition:.3s}
  .bp-close:hover{background:var(--ink)}
  .bp-close::before,.bp-close::after{content:""; position:absolute; top:50%; left:50%; width:17px; height:1.6px; background:var(--ink); transition:.3s}
  .bp-close:hover::before,.bp-close:hover::after{background:var(--bg)}
  .bp-close::before{transform:translate(-50%,-50%) rotate(45deg)} .bp-close::after{transform:translate(-50%,-50%) rotate(-45deg)}
  .bp-head{max-width:var(--maxw); margin:0 auto; padding:clamp(26px,4vh,48px) clamp(20px,5vw,64px) clamp(20px,3vh,34px); display:grid; grid-template-columns:auto 1fr; gap:clamp(22px,3.5vw,44px); align-items:center}
  .bp-brandlogo{width:clamp(120px,15vw,180px); aspect-ratio:1/1; background:#fff; border:1px solid var(--line); border-radius:6px; display:grid; place-items:center; padding:16px; flex:none}
  .bp-brandlogo img{max-width:100%; max-height:100%; object-fit:contain}
  .bp-head .cat{font-size:13px; letter-spacing:.22em; text-transform:uppercase; color:var(--accent); font-weight:600; margin-bottom:10px}
  .bp-head h3{font-weight:800; font-size:clamp(28px,4.4vw,56px); line-height:1.04; letter-spacing:-.015em; margin-bottom:14px}
  .bp-head p{color:var(--ink-soft); font-size:clamp(16px,1.4vw,20px); line-height:1.7; font-weight:300; max-width:60ch}
  .bp-ads{max-width:var(--maxw); margin:0 auto; padding:0 clamp(20px,5vw,64px) clamp(44px,6vh,80px); display:grid; gap:clamp(14px,1.6vw,22px)}
  .bp-ads.col3{grid-template-columns:repeat(3,1fr)}
  .bp-ads.col2{grid-template-columns:repeat(2,1fr)}
  .ad{background:var(--bg2); border:1px solid var(--line); cursor:zoom-in; overflow:hidden; border-radius:4px; transition:transform .4s, box-shadow .4s}
  .ad:hover{transform:translateY(-5px); box-shadow:0 20px 40px -22px rgba(20,18,15,.45)}
  .ad img{width:100%; height:auto}
  .bp-nav{max-width:var(--maxw); margin:0 auto; padding:0 clamp(20px,5vw,64px) clamp(50px,7vh,90px); display:grid; grid-template-columns:1fr 1fr; gap:clamp(12px,2vw,20px)}
  .bp-nav .bp-nav-btn{display:flex; flex-direction:column; gap:7px; padding:20px 26px; background:var(--bg2); border:1px solid var(--line); border-radius:8px; cursor:pointer; font-family:inherit; text-align:start; transition:.3s; color:var(--ink)}
  .bp-nav .bp-nav-btn:hover{background:var(--ink); color:var(--bg); border-color:var(--ink); transform:translateY(-3px)}
  .bp-nav .dir{font-size:12px; letter-spacing:.14em; color:var(--accent); font-weight:600}
  .bp-nav .bp-nav-btn:hover .dir{color:var(--bg)}
  .bp-nav .nt{font-weight:700; font-size:clamp(16px,1.5vw,21px); line-height:1.2}
  .bp-nav .next{text-align:end; align-items:flex-end}
  @media(max-width:560px){ .bp-nav{grid-template-columns:1fr} }

  /* LIGHTBOX (single ad, no crop) */
  .lb{position:fixed; inset:0; z-index:130; background:rgba(18,16,14,.94); display:none; align-items:center; justify-content:center}
  .lb.open{display:flex; animation:fade .3s}
  .lb img{max-width:92vw; max-height:88vh; width:auto; height:auto; object-fit:contain; box-shadow:0 30px 80px rgba(0,0,0,.5)}
  .lb-x{position:fixed; top:20px; inset-inline-start:24px; width:48px; height:48px; border-radius:50%; border:1px solid rgba(255,255,255,.3); background:rgba(255,255,255,.08); cursor:pointer; color:#fff; font-size:20px}
  .lb-x:hover{background:rgba(255,255,255,.2)}
  .lb-arrow{position:fixed; top:50%; transform:translateY(-50%); width:56px; height:56px; border-radius:50%; border:1px solid rgba(255,255,255,.3); background:rgba(255,255,255,.08); cursor:pointer; color:#fff; font-size:24px; display:grid; place-items:center; transition:.25s}
  .lb-arrow:hover{background:rgba(255,255,255,.22)}
  .lb-prev{right:22px} .lb-next{left:22px}
  .lb-count{position:fixed; bottom:22px; left:50%; transform:translateX(-50%); color:#fff; font-size:14px; letter-spacing:.1em; opacity:.8; direction:ltr}

  @media(max-width:1000px){ .tiles{grid-template-columns:repeat(3,1fr)} }
  @media(max-width:880px){
    .hero-grid{grid-template-columns:1fr; gap:24px; align-items:center} header.hero{padding-bottom:24px} .hero-portrait{order:-1; height:auto} .hero-portrait img{max-width:200px}
    #about .about-grid{grid-template-columns:1fr; gap:14px}
    .bp-head{grid-template-columns:1fr} .bp-ads.col3,.bp-ads.col2{grid-template-columns:1fr 1fr}
    .navlinks{gap:16px} .navlinks .hide-sm{display:none} .design-name{display:none}
  }
  @media(max-width:560px){ .tiles{grid-template-columns:repeat(2,1fr)} .bp-ads.col3,.bp-ads.col2{grid-template-columns:1fr} }
</style>
</head>
<body>

<nav id="nav">
  <div class="brandwrap">
    <img class="logo-mark" src="assets/logo-black.png" alt="MISHA Graphics" onclick="location.href='#top'">
    <div class="design-switch" id="dswitch">
      <button class="design-name" id="ds-toggle" type="button">גלריה מינימליסטית <span class="ds-caret">▾</span></button>
      <div class="ds-menu">
        <span class="ds-head">העיצובים</span>
        <a href="design-1-gallery.html" class="cur">גלריה מינימליסטית</a>
        <a href="design-2-poster.html">קיר פוסטרים</a>
        <a href="design-3-brutalist.html">סטודיו ברוטליסטי</a>
        <a href="design-4-lab.html">זכוכית</a>
        <a href="design-5-particles.html">חלקיקים</a>
        <a href="design-6-luxe.html">יוקרה מודרנית</a>
        <a href="design-7-kinetic.html">קינטי</a>
        <a href="design-8-riso.html">ריזוגרף</a>
        <a href="design-9-cinema.html">קולנועי</a>
        <div class="ds-divider"></div>
        <a href="index.html" class="home">↩ עמוד הבחירה</a>
      </div>
    </div>
  </div>
  <div class="navlinks">
    <a href="#works">עבודות</a>
    <a href="#about" class="hide-sm">אודות</a>
    <a href="#contact">קשר</a>
  </div>
</nav>

<a id="top"></a>
<div class="wrap">
  <header class="hero" data-screen-label="Hero">
    <div class="hero-grid">
      <div>
        <p class="hello" id="h-hello"></p>
        <h1>ארט דיירקטור<br>וצייד רעיונות.</h1>
        <p class="lines" id="h-lines"></p>
        <p class="sub" id="h-sub"></p>
      </div>
      <div class="hero-portrait"><img src="assets/portrait.png" alt="מישה"></div>
    </div>
    <div class="scrolldown"><span>גלול</span><span class="bar"></span></div>
  </header>

  <section class="sec" id="about" data-screen-label="אודות">
    <div class="about-grid">
      <div class="reveal"><div class="kicker" id="a-kicker"></div><h2>קצת<br>עליי.</h2></div>
      <div class="reveal" id="a-body"></div>
    </div>
  </section>

  <section class="sec" id="works" data-screen-label="עבודות">
    <div class="works-head reveal">
      <h2 id="w-title"></h2>
      <p class="sub" id="w-sub"></p>
    </div>
    <div class="tiles" id="tiles"></div>
  </section>

  <section class="sec" id="contact" data-screen-label="קשר">
    <div class="contact-lines reveal" id="c-lines"></div>
    <div class="contact-actions reveal">
      <a class="btn solid" id="c-mail" href="#">כתבו לי</a>
      <a class="btn ghost" id="c-ig" href="#">אינסטגרם</a>
    </div>
  </section>
</div>

<footer>
  <p class="f" id="foot"></p>
  <p class="c">© <span id="yr"></span> MISHA Graphics · כל הזכויות שמורות</p>
</footer>

<!-- BRAND PAGE -->
<div class="brandpage" id="bp">
  <div class="bp-bar">
    <img class="ml" src="assets/logo-black.png" alt="MISHA">
    <button class="bp-close" id="bp-close" aria-label="סגור"></button>
  </div>
  <div class="bp-head">
    <div class="bp-brandlogo" id="bp-logo"></div>
    <div>
      <div class="cat" id="bp-cat"></div>
      <h3 id="bp-title"></h3>
      <p id="bp-desc"></p>
    </div>
  </div>
  <div class="bp-ads" id="bp-ads"></div>
  <div class="bp-nav">
    <button class="bp-nav-btn prev" id="bp-prev" type="button"><span class="dir">→ העבודה הקודמת</span><span class="nt" id="bp-prev-t"></span></button>
    <button class="bp-nav-btn next" id="bp-next" type="button"><span class="dir">העבודה הבאה ←</span><span class="nt" id="bp-next-t"></span></button>
  </div>
</div>

<!-- LIGHTBOX -->
<div class="lb" id="lb">
  <button class="lb-x" id="lb-x">✕</button>
  <button class="lb-arrow lb-prev" id="lb-prev">‹</button>
  <img id="lb-img" src="" alt="">
  <button class="lb-arrow lb-next" id="lb-next">›</button>
  <div class="lb-count" id="lb-count"></div>
</div>

<script src="assets/works.js"></script>
<script>
  const M=window.MISHA;
  M.works.forEach(w=>{ w.logo=`assets/works/${w.id}/cover.png`; });

  document.getElementById('h-hello').textContent=M.hero.hello;
  document.getElementById('h-lines').innerHTML=M.hero.lines.map((l,i)=>i===2?`<b>${l}</b>`:l).join('<br>');
  document.getElementById('h-sub').textContent=M.hero.sub;
  document.getElementById('a-kicker').textContent=M.about.kicker;
  document.getElementById('a-body').innerHTML=M.about.body.map(p=>`<p>${p}</p>`).join('');
  document.getElementById('w-title').textContent=M.worksIntro.title;
  document.getElementById('w-sub').textContent=M.worksIntro.sub;
  document.getElementById('c-lines').innerHTML=`${M.contact.a}<br><span class="soft">${M.contact.b}</span><br>${M.contact.c}<br><span class="soft">${M.contact.d}</span>`;
  document.getElementById('c-mail').href='mailto:'+M.contact.email;
  document.getElementById('c-ig').href='https://instagram.com/'+M.contact.instagram.replace('@','');
  document.getElementById('foot').textContent=M.footer;
  document.getElementById('yr').textContent=new Date().getFullYear();

  function logoInner(w){ return `<div class="logobox"><img src="${w.logo}" alt="${w.brand}"></div>`; }

  const tiles=document.getElementById('tiles');
  M.works.forEach((w,i)=>{
    const t=document.createElement('div'); t.className='tile reveal';
    t.innerHTML=`${logoInner(w)}<div class="reveal-meta"><span class="t">${w.title}</span><span class="n">${String(i+1).padStart(2,'0')}</span></div>`;
    t.addEventListener('click',()=>openBrand(w));
    tiles.appendChild(t);
  });

  // Brand page
  const bp=document.getElementById('bp');
  let curWork=null;
  function openBrand(w){
    curWork=w;
    const bl=document.getElementById('bp-logo');
    bl.innerHTML = `<img src="${w.logo}" alt="${w.brand}">`;
    document.getElementById('bp-cat').textContent=`${w.brand} · ${w.category} · ${w.year}`;
    document.getElementById('bp-title').textContent=w.title;
    document.getElementById('bp-desc').textContent=w.desc;
    const ads=document.getElementById('bp-ads');
    ads.className='bp-ads '+(w.orient==='landscape'?'col2':'col3');
    ads.innerHTML=w.images.map((s,idx)=>`<div class="ad" data-i="${idx}"><img src="${s}" alt="${w.title}" loading="lazy"></div>`).join('');
    ads.querySelectorAll('.ad').forEach(a=>a.addEventListener('click',()=>openLB(+a.dataset.i)));
    const i=M.works.indexOf(w), n=M.works.length;
    document.getElementById('bp-prev-t').textContent=M.works[(i-1+n)%n].title;
    document.getElementById('bp-next-t').textContent=M.works[(i+1)%n].title;
    bp.classList.add('open'); document.body.style.overflow='hidden'; bp.scrollTop=0;
  }
  function closeBrand(){ bp.classList.remove('open'); document.body.style.overflow=''; }
  document.getElementById('bp-close').addEventListener('click',closeBrand);
  (function(){var bar=document.querySelector('.bp-bar'); if(!bar) return; var ml=bar.querySelector('.ml'); if(ml){ml.style.cursor='pointer'; ml.title='\u05dc\u05e2\u05de\u05d5\u05d3 \u05d4\u05d1\u05d9\u05ea'; ml.addEventListener('click',function(){closeBrand(); window.scrollTo(0,0);});} if(!bar.querySelector('.bp-nav-links')){var nav=document.createElement('div'); nav.className='bp-nav-links'; nav.style.cssText='display:flex;gap:18px;align-items:center;margin-inline-start:auto;margin-inline-end:16px;font-size:14px'; [['\u05e2\u05d1\u05d5\u05d3\u05d5\u05ea','works'],['\u05d0\u05d5\u05d3\u05d5\u05ea','about'],['\u05e7\u05e9\u05e8','contact']].forEach(function(p){var a=document.createElement('a'); a.textContent=p[0]; a.href='#'+p[1]; a.style.cssText='text-decoration:none;color:inherit;font-weight:600;cursor:pointer;opacity:.85'; a.addEventListener('click',function(e){e.preventDefault(); closeBrand(); var el=document.getElementById(p[1]); if(el) window.scrollTo(0, el.offsetTop-70);}); nav.appendChild(a);}); bar.insertBefore(nav, bar.querySelector('.bp-close'));}})();
  document.getElementById('bp-prev').addEventListener('click',()=>{const i=M.works.indexOf(curWork),n=M.works.length;openBrand(M.works[(i-1+n)%n]);});
  document.getElementById('bp-next').addEventListener('click',()=>{const i=M.works.indexOf(curWork),n=M.works.length;openBrand(M.works[(i+1)%n]);});

  // Lightbox
  const lb=document.getElementById('lb'), lbImg=document.getElementById('lb-img'), lbCount=document.getElementById('lb-count');
  let li=0;
  function openLB(i){ li=i; renderLB(); lb.classList.add('open'); }
  function renderLB(){ const im=curWork.images; lbImg.src=im[li]; lbCount.textContent=`${li+1} / ${im.length}`; const multi=im.length>1; document.getElementById('lb-prev').style.display=multi?'grid':'none'; document.getElementById('lb-next').style.display=multi?'grid':'none'; }
  function closeLB(){ lb.classList.remove('open'); }
  // ימין(›)=אחורה, שמאל(‹)=קדימה (לפי כיוון קריאה עברי)
  document.getElementById('lb-next').addEventListener('click',e=>{e.stopPropagation(); li=(li+1)%curWork.images.length; renderLB();});
  document.getElementById('lb-prev').addEventListener('click',e=>{e.stopPropagation(); li=(li-1+curWork.images.length)%curWork.images.length; renderLB();});
  document.getElementById('lb-x').addEventListener('click',closeLB);
  lb.addEventListener('click',e=>{ if(e.target===lb) closeLB(); });
  addEventListener('keydown',e=>{
    if(e.key==='Escape'){ if(lb.classList.contains('open'))closeLB(); else closeBrand(); }
    if(lb.classList.contains('open')&&curWork){
      if(e.key==='ArrowRight'){ li=(li-1+curWork.images.length)%curWork.images.length; renderLB(); }
      if(e.key==='ArrowLeft'){ li=(li+1)%curWork.images.length; renderLB(); }
    }
  });

  const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target);}}),{threshold:.12});
  document.querySelectorAll('.reveal').forEach(el=>io.observe(el));
  requestAnimationFrame(()=>document.querySelector('.hero-portrait').classList.add('in'));
  const nav=document.getElementById('nav');
  addEventListener('scroll',()=>nav.classList.toggle('scrolled',scrollY>40));
  (function(){const s=document.getElementById('dswitch'),t=document.getElementById('ds-toggle');if(s&&t){t.addEventListener('click',e=>{e.stopPropagation();s.classList.toggle('open');});document.addEventListener('click',()=>s.classList.remove('open'));}})();
</script>
</body>
</html>
