<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MISHA Graphics · קיר עבודות</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f1ede6; --card:#fff; --ink:#191613; --soft:#6b665e; --line:#e0dace;
    --maxw:1340px;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{font-family:'Rubik',system-ui,sans-serif; background:var(--bg); color:var(--ink); -webkit-font-smoothing:antialiased; line-height:1.6; overflow-x:hidden}
  ::selection{background:var(--ink); color:#fff}
  img{display:block}
  .wrap{max-width:var(--maxw); margin:0 auto; padding:0 clamp(18px,4vw,52px)}

  nav{position:fixed; inset:0 0 auto 0; z-index:50; display:flex; align-items:center; justify-content:space-between; padding:13px clamp(18px,4vw,52px); background:color-mix(in oklab,var(--bg) 80%,transparent); backdrop-filter:blur(12px); transition:box-shadow .3s}
  nav.scrolled{box-shadow:0 2px 20px -10px rgba(0,0,0,.3)}
  .logo-mark{height:40px; mix-blend-mode:multiply; cursor:pointer}
  .brandwrap{display:flex; align-items:center; gap:14px}
  .design-switch{position:relative}
  .design-name{font-size:13px; font-weight:700; color:var(--soft); letter-spacing:.02em; padding-inline-start:14px; border-inline-start:1px solid var(--line); display:inline-flex; align-items:center; gap:7px; cursor:pointer; background:none; border-top:none; border-bottom:none; border-right:none; font-family:inherit}
  .design-name:hover{color:var(--ink)}
  .ds-caret{font-size:9px; transition:transform .25s}
  .design-switch.open .ds-caret{transform:rotate(180deg)}
  .ds-menu{position:absolute; top:calc(100% + 14px); inset-inline-start:0; min-width:232px; background:var(--card); border:1px solid var(--line); border-radius:18px; padding:8px; display:flex; flex-direction:column; gap:2px; opacity:0; visibility:hidden; transform:translateY(-8px); transition:opacity .24s ease, transform .24s cubic-bezier(.34,1.3,.5,1); box-shadow:0 26px 56px -22px rgba(0,0,0,.4); z-index:80}
  .design-switch.open .ds-menu{opacity:1; visibility:visible; transform:none}
  .ds-menu .ds-head{font-size:11px; letter-spacing:.2em; text-transform:uppercase; color:var(--soft); padding:8px 12px 5px}
  .ds-menu a{text-decoration:none; color:var(--ink); font-size:14px; font-weight:700; padding:11px 13px; border-radius:12px; display:flex; align-items:center; justify-content:space-between; gap:10px; transition:.16s}
  .ds-menu a:hover{background:var(--bg)}
  .ds-menu a.cur{color:#1559A3}
  .ds-menu a.cur::after{content:"●"; font-size:8px}
  .ds-menu .ds-divider{height:1px; background:var(--line); margin:6px 4px}
  .ds-menu a.home{color:var(--soft); font-weight:500; font-size:13px}
  .navlinks{display:flex; gap:clamp(10px,2.4vw,28px); align-items:center}
  .navlinks a{color:var(--ink); text-decoration:none; font-weight:600; font-size:15px; padding:7px 14px; border-radius:100px; transition:.25s}
  .navlinks a:hover{background:var(--ink); color:#fff}
  .navlinks .home{font-weight:500; color:var(--soft)}
  .navlinks .home:hover{background:none; color:var(--ink)}

  /* HERO */
  header.hero{min-height:84svh; display:grid; grid-template-columns:1.05fr .95fr; gap:clamp(28px,4vw,56px); align-items:center; padding-top:92px; padding-bottom:28px; position:relative; z-index:0}
  header.hero > *{position:relative; z-index:1}
  header.hero::before{content:""; position:absolute; top:0; bottom:0; left:50%; transform:translateX(-50%); width:100vw; z-index:0; background-color:#f4f0e8; background-image:radial-gradient(rgba(25,22,19,.045) 1.2px, transparent 1.2px); background-size:22px 22px}
  .hero .hero-photo{border-radius:28px; overflow:hidden; aspect-ratio:4/3; box-shadow:0 34px 64px -34px rgba(0,0,0,.45); border:1px solid var(--line)}
  .hero .hero-photo img{width:100%; height:100%; object-fit:cover; display:block}
  .hero .hi{font-size:clamp(21px,2.4vw,32px); font-weight:600; color:var(--soft); margin-bottom:10px}
  .hero h1{font-weight:900; font-size:clamp(36px,6vw,86px); line-height:.98; letter-spacing:-.02em; max-width:16ch; margin-bottom:18px}
  .hero h1 .hl{background:linear-gradient(105deg,#1DB954,#1559A3); -webkit-background-clip:text; background-clip:text; color:transparent}
  .hero .lines{font-size:clamp(17px,1.6vw,22px); color:var(--soft); max-width:48ch; line-height:1.6}
  .hero .lines b{color:var(--ink); font-weight:700}
  .hero .chips{display:flex; gap:10px; flex-wrap:wrap; margin-top:26px}
  .hero .chips span{background:var(--card); border:1px solid var(--line); border-radius:100px; padding:8px 18px; font-weight:600; font-size:14px}

  .sec{padding:clamp(42px,6vh,84px) 0; position:relative; z-index:0}
  .sec > *{position:relative; z-index:1}
  .sec::before{content:""; position:absolute; top:0; bottom:0; left:50%; transform:translateX(-50%); width:100vw; z-index:0; background:var(--tint)}
  #about{--tint:#e6edf2}
  #works{--tint:#e6e4dd}
  #contact{--tint:#f4ecdf}
  #works::before{background-image:linear-gradient(rgba(25,22,19,.05) 1px, transparent 1px), linear-gradient(90deg, rgba(25,22,19,.05) 1px, transparent 1px); background-size:30px 30px}
  .kick{display:inline-block; font-weight:800; font-size:13px; letter-spacing:.18em; text-transform:uppercase; color:#fff; background:var(--ink); padding:6px 14px; border-radius:100px; margin-bottom:22px}
  .sec h2{font-weight:900; font-size:clamp(30px,5vw,64px); line-height:1.02; letter-spacing:-.02em}

  /* ABOUT */
  #about{display:grid; grid-template-columns:1fr 1.4fr; gap:clamp(24px,4vw,56px); align-items:center}
  #about .card-about{background:var(--card); border:1px solid var(--line); border-radius:28px; padding:clamp(24px,3.5vw,42px)}
  #about p{font-size:clamp(16px,1.4vw,19px); color:var(--soft); margin-bottom:14px; line-height:1.7}
  #about p:first-child{color:var(--ink); font-weight:600; font-size:clamp(18px,1.7vw,23px)}

  /* WORKS */
  .works-head{text-align:center; margin-bottom:clamp(24px,3.5vh,42px)}
  .works-head .sub{color:var(--soft); font-size:clamp(17px,1.5vw,21px); font-weight:500; margin-top:14px}
  .wall{display:grid; grid-template-columns:repeat(3,1fr); gap:clamp(14px,1.8vw,26px)}
  .ptile{position:relative; border-radius:24px; overflow:hidden; cursor:pointer; padding:clamp(18px,2vw,28px); display:flex; flex-direction:column; transition:transform .45s cubic-bezier(.34,1.4,.5,1), box-shadow .45s}
  .ptile:hover{transform:translateY(-8px) rotate(-1.2deg); box-shadow:0 28px 50px -24px rgba(0,0,0,.45)}
  .ptile .num{font-weight:900; font-size:15px; opacity:.7}
  .ptile .panel{background:#fff; border-radius:16px; margin:14px 0; display:grid; place-items:center; padding:12%; aspect-ratio:1/1}
  .ptile .panel img{max-width:100%; max-height:100%; width:auto; height:auto; object-fit:contain}
  .ptile .panel .txtlogo{font-weight:900; font-size:clamp(22px,2.6vw,34px); text-align:center}
  .ptile .foot{display:flex; flex-direction:column; gap:3px}
  .ptile .foot .t{font-weight:800; font-size:clamp(16px,1.5vw,21px); line-height:1.15}
  .ptile .foot .b{font-weight:500; font-size:13px; opacity:.85}
  .ptile .go{display:none}
  .ptile:hover .go{opacity:1; transform:none}

  /* CONTACT */
  #contact{text-align:center}
  #contact .box{background:var(--ink); color:#fff; border-radius:32px; padding:clamp(34px,5vw,64px) clamp(24px,5vw,56px)}
  #contact .big{font-weight:900; font-size:clamp(28px,5vw,68px); line-height:1.06; letter-spacing:-.02em}
  #contact .big .g{background:linear-gradient(105deg,#1DB954,#E5418F); -webkit-background-clip:text; background-clip:text; color:transparent}
  #contact .acts{margin-top:30px; display:flex; gap:12px; justify-content:center; flex-wrap:wrap}
  #contact .acts a{background:#fff; color:var(--ink); border-radius:100px; padding:15px 30px; text-decoration:none; font-weight:700; font-size:16px; transition:.3s}
  #contact .acts a:hover{transform:translateY(-3px) scale(1.03)}
  #contact .acts a.alt{background:transparent; color:#fff; border:1.5px solid rgba(255,255,255,.4)}

  footer{padding:42px 0; text-align:center}
  footer .f{color:var(--soft); font-weight:500; font-size:15px; max-width:52ch; margin:0 auto 12px}
  footer .c{font-size:13px; color:var(--soft)}

  .reveal{opacity:0; transform:translateY(30px); transition:.7s cubic-bezier(.2,.7,.2,1)}
  .reveal.in{opacity:1; transform:none}

  /* BRAND PAGE */
  .brandpage{position:fixed; inset:0; z-index:100; background:var(--bg); display:none; overflow-y:auto}
  .brandpage.open{display:block; animation:fade .4s}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .bp-bar{position:sticky; top:0; z-index:3; display:flex; align-items:center; justify-content:space-between; padding:12px clamp(18px,4vw,52px); background:color-mix(in oklab,var(--bg) 82%,transparent); backdrop-filter:blur(10px)}
  .bp-bar .ml{height:36px; mix-blend-mode:multiply}
  .bp-close{background:var(--ink); color:#fff; border:none; border-radius:100px; padding:11px 22px; font-family:inherit; font-weight:700; font-size:14px; cursor:pointer; transition:.25s}
  .bp-close:hover{transform:scale(1.05)}
  .bp-hero{padding:clamp(18px,3vh,38px) clamp(18px,4vw,52px) clamp(22px,3.5vh,42px)}
  .bp-hero .inner{max-width:var(--maxw); margin:0 auto; border-radius:26px; padding:clamp(24px,3.5vw,44px); display:grid; grid-template-columns:auto 1fr; gap:clamp(22px,3.5vw,44px); align-items:center}
  .bp-logo{width:clamp(120px,15vw,180px); aspect-ratio:1/1; background:#fff; border-radius:20px; display:grid; place-items:center; padding:16px; flex:none}
  .bp-logo img{max-width:100%; max-height:100%; object-fit:contain}
  .bp-hero .cat{font-weight:700; font-size:13px; letter-spacing:.14em; text-transform:uppercase; margin-bottom:12px; opacity:.85}
  .bp-hero h3{font-weight:900; font-size:clamp(28px,4.6vw,60px); line-height:1.02; letter-spacing:-.02em; margin-bottom:14px}
  .bp-hero p{font-size:clamp(16px,1.45vw,20px); line-height:1.7; max-width:60ch; opacity:.92}
  .bp-ads{max-width:var(--maxw); margin:0 auto; padding:0 clamp(18px,4vw,52px) clamp(44px,6vh,80px); display:grid; gap:clamp(14px,1.6vw,22px)}
  .bp-ads.col3{grid-template-columns:repeat(3,1fr)} .bp-ads.col2{grid-template-columns:repeat(2,1fr)}
  .ad{background:var(--card); border-radius:18px; overflow:hidden; cursor:zoom-in; border:1px solid var(--line); transition:transform .4s cubic-bezier(.34,1.3,.5,1), box-shadow .4s}
  .ad:hover{transform:translateY(-6px); box-shadow:0 22px 42px -22px rgba(0,0,0,.45)}
  .ad img{width:100%; height:auto}
  .bp-nav{max-width:var(--maxw); margin:0 auto; padding:0 clamp(18px,4vw,52px) clamp(50px,7vh,90px); display:grid; grid-template-columns:1fr 1fr; gap:clamp(12px,2vw,20px)}
  .bp-nav .bp-nav-btn{display:flex; flex-direction:column; gap:7px; padding:20px 26px; background:var(--card); border:1px solid var(--line); border-radius:18px; cursor:pointer; font-family:inherit; text-align:start; transition:.35s cubic-bezier(.34,1.3,.5,1); color:var(--ink)}
  .bp-nav .bp-nav-btn:hover{transform:translateY(-5px); box-shadow:0 20px 40px -22px rgba(0,0,0,.4)}
  .bp-nav .dir{font-size:12px; letter-spacing:.1em; color:#1559A3; font-weight:700}
  .bp-nav .nt{font-weight:800; font-size:clamp(16px,1.5vw,21px); line-height:1.2}
  .bp-nav .next{text-align:end; align-items:flex-end}
  @media(max-width:560px){ .bp-nav{grid-template-columns:1fr} }

  /* LIGHTBOX */
  .lb{position:fixed; inset:0; z-index:130; background:rgba(15,13,11,.95); display:none; align-items:center; justify-content:center}
  .lb.open{display:flex; animation:fade .3s}
  .lb img{max-width:92vw; max-height:88vh; width:auto; height:auto; object-fit:contain; border-radius:8px; box-shadow:0 30px 80px rgba(0,0,0,.5)}
  .lb-x{position:fixed; top:18px; inset-inline-start:22px; width:48px; height:48px; border-radius:50%; border:none; background:rgba(255,255,255,.12); color:#fff; cursor:pointer; font-size:20px}
  .lb-x:hover{background:rgba(255,255,255,.25)}
  .lb-arrow{position:fixed; top:50%; transform:translateY(-50%); width:56px; height:56px; border-radius:50%; border:none; background:rgba(255,255,255,.12); color:#fff; cursor:pointer; font-size:26px; display:grid; place-items:center}
  .lb-arrow:hover{background:rgba(255,255,255,.25)}
  .lb-prev{right:20px} .lb-next{left:20px}
  .lb-count{position:fixed; bottom:20px; left:50%; transform:translateX(-50%); color:#fff; opacity:.8; font-size:14px; direction:ltr}

  @media(max-width:1000px){ .wall{grid-template-columns:repeat(2,1fr)} #about{grid-template-columns:1fr; gap:20px} }
  @media(max-width:880px){ header.hero{grid-template-columns:1fr; gap:22px} .hero .hero-photo{order:-1} .bp-hero .inner{grid-template-columns:1fr} .bp-ads.col3,.bp-ads.col2{grid-template-columns:1fr 1fr} .navlinks .hide-sm{display:none} }
  @media(max-width:560px){ .wall{grid-template-columns:1fr 1fr} .bp-ads.col3,.bp-ads.col2{grid-template-columns:1fr} .design-name{display:none} }
</style>
</head>
<body>

<nav id="nav">
  <div class="brandwrap">
    <img class="logo-mark" src="assets/logo-black.png" alt="MISHA Graphics" onclick="location.href='#top'">
    <div class="design-switch" id="dswitch">
      <button class="design-name" id="ds-toggle" type="button">קיר פוסטרים <span class="ds-caret">▾</span></button>
      <div class="ds-menu">
        <span class="ds-head">העיצובים</span>
        <a href="design-1-gallery.html">גלריה מינימליסטית</a>
        <a href="design-2-poster.html" class="cur">קיר פוסטרים</a>
        <a href="design-3-brutalist.html">סטודיו ברוטליסטי</a>
        <a href="design-4-lab.html">זכוכית</a>
        <a href="design-5-particles.html">חלקיקים</a>
        <a href="design-6-luxe.html">יוקרה מודרנית</a>
        <a href="design-7-kinetic.html">קינטי</a>
        <a href="design-8-riso.html">ריזוגרף</a>
        <a href="design-9-cinema.html">קולנועי</a>
        <div class="ds-divider"></div>
        <a href="index.html" class="home">↩ עמוד הבחירה</a>
      </div>
    </div>
  </div>
  <div class="navlinks">
    <a href="#works">עבודות</a>
    <a href="#about" class="hide-sm">אודות</a>
    <a href="#contact">קשר</a>
  </div>
</nav>

<a id="top"></a>
<div class="wrap">
  <header class="hero" data-screen-label="Hero">
    <div class="hero-text">
      <p class="hi" id="h-hi"></p>
      <h1>רעיונות, קונספטים <span class="hl">וקמפיינים</span>.</h1>
      <p class="lines" id="h-lines"></p>
      <div class="chips"><span>פרסום</span><span>מיתוג</span><span>קופי</span><span>טיפוגרפיה</span></div>
    </div>
    <div class="hero-photo reveal"><img src="assets/misha-deskwall.jpeg" alt="מישה בסטודיו"></div>
  </header>

  <section class="sec" id="about" data-screen-label="אודות">
    <div class="reveal"><span class="kick" id="a-kick"></span><h2>קצת עליי,<br>בלי יותר מדי<br>מילים גדולות.</h2></div>
    <div class="card-about reveal" id="a-body"></div>
  </section>

  <section class="sec" id="works" data-screen-label="עבודות">
    <div class="works-head reveal">
      <h2 id="w-title"></h2>
      <p class="sub" id="w-sub"></p>
    </div>
    <div class="wall" id="wall"></div>
  </section>

  <section class="sec" id="contact" data-screen-label="קשר">
    <div class="box reveal">
      <div class="big" id="c-big"></div>
      <div class="acts">
        <a id="c-mail" href="#">כתבו לי ✉</a>
        <a class="alt" id="c-ig" href="#">אינסטגרם</a>
        <a class="alt" id="c-tel" href="#">טלפון</a>
      </div>
    </div>
  </section>
</div>

<footer>
  <p class="f" id="foot"></p>
  <p class="c">© <span id="yr"></span> MISHA Graphics</p>
</footer>

<div class="brandpage" id="bp">
  <div class="bp-bar"><img class="ml" src="assets/logo-black.png" alt="MISHA"><button class="bp-close" id="bp-close">סגירה ✕</button></div>
  <div class="bp-hero" id="bp-hero">
    <div class="inner" id="bp-inner">
      <div class="bp-logo" id="bp-logo"></div>
      <div><div class="cat" id="bp-cat"></div><h3 id="bp-title"></h3><p id="bp-desc"></p></div>
    </div>
  </div>
  <div class="bp-ads" id="bp-ads"></div>
  <div class="bp-nav">
    <button class="bp-nav-btn prev" id="bp-prev" type="button"><span class="dir">→ העבודה הקודמת</span><span class="nt" id="bp-prev-t"></span></button>
    <button class="bp-nav-btn next" id="bp-next" type="button"><span class="dir">העבודה הבאה ←</span><span class="nt" id="bp-next-t"></span></button>
  </div>
</div>

<div class="lb" id="lb">
  <button class="lb-x" id="lb-x">✕</button>
  <button class="lb-arrow lb-prev" id="lb-prev">‹</button>
  <img id="lb-img" src="" alt="">
  <button class="lb-arrow lb-next" id="lb-next">›</button>
  <div class="lb-count" id="lb-count"></div>
</div>

<script src="assets/works.js"></script>
<script>
  const M=window.MISHA;
  M.works.forEach(w=>{ w.logo=`assets/works/${w.id}/cover.png`; });
  function isLight(hex){ const c=hex.replace('#',''); const r=parseInt(c.substr(0,2),16),g=parseInt(c.substr(2,2),16),b=parseInt(c.substr(4,2),16); return (0.299*r+0.587*g+0.114*b)>150; }
  function fg(hex){ return isLight(hex)?'#191613':'#fff'; }

  document.getElementById('h-hi').textContent=M.hero.hello;
  document.getElementById('h-lines').innerHTML=`${M.hero.lines[0]} ${M.hero.lines[1]} <b>${M.hero.lines[2]}</b>`;
  document.getElementById('a-kick').textContent=M.about.kicker;
  document.getElementById('a-body').innerHTML=M.about.body.map(p=>`<p>${p}</p>`).join('');
  document.getElementById('w-title').textContent=M.worksIntro.title;
  document.getElementById('w-sub').textContent=M.worksIntro.sub;
  document.getElementById('c-big').innerHTML=`${M.contact.a} <span class="g">${M.contact.b}</span><br>${M.contact.c} <span class="g">${M.contact.d}</span>`;
  document.getElementById('c-mail').href='mailto:'+M.contact.email;
  document.getElementById('c-ig').href='https://instagram.com/'+M.contact.instagram.replace('@','');
  document.getElementById('c-tel').href='tel:'+M.contact.phone.replace(/-/g,'');
  document.getElementById('foot').textContent=M.footer;
  document.getElementById('yr').textContent=new Date().getFullYear();

  const wall=document.getElementById('wall');
  M.works.forEach((w,i)=>{
    const t=document.createElement('div'); t.className='ptile reveal';
    t.style.background=w.accent; t.style.color=fg(w.accent);
    const panelInner = `<img src="${w.logo}" alt="${w.brand}">`;
    t.innerHTML=`<span class="go">←</span><span class="num">${String(i+1).padStart(2,'0')} / ${String(M.works.length).padStart(2,'0')}</span>
      <div class="panel">${panelInner}</div>
      <div class="foot"><span class="t">${w.title}</span><span class="b">${w.brand} · ${w.category}</span></div>`;
    t.addEventListener('click',()=>openBrand(w));
    wall.appendChild(t);
  });

  const bp=document.getElementById('bp'); let curWork=null;
  function openBrand(w){
    curWork=w;
    const inner=document.getElementById('bp-inner');
    inner.style.background=w.accent; inner.style.color=fg(w.accent);
    const bl=document.getElementById('bp-logo');
    bl.innerHTML=`<img src="${w.logo}" alt="${w.brand}">`;
    document.getElementById('bp-cat').textContent=`${w.brand} · ${w.category} · ${w.year}`;
    document.getElementById('bp-title').textContent=w.title;
    document.getElementById('bp-desc').textContent=w.desc;
    const ads=document.getElementById('bp-ads');
    ads.className='bp-ads '+(w.orient==='landscape'?'col2':'col3');
    ads.innerHTML=w.images.map((s,idx)=>`<div class="ad" data-i="${idx}"><img src="${s}" alt="${w.title}" loading="lazy"></div>`).join('');
    ads.querySelectorAll('.ad').forEach(a=>a.addEventListener('click',()=>openLB(+a.dataset.i)));
    const i=M.works.indexOf(w), n=M.works.length;
    document.getElementById('bp-prev-t').textContent=M.works[(i-1+n)%n].title;
    document.getElementById('bp-next-t').textContent=M.works[(i+1)%n].title;
    bp.classList.add('open'); document.body.style.overflow='hidden'; bp.scrollTop=0;
  }
  function closeBrand(){ bp.classList.remove('open'); document.body.style.overflow=''; }
  document.getElementById('bp-close').addEventListener('click',closeBrand);
  (function(){var bar=document.querySelector('.bp-bar'); if(!bar) return; var ml=bar.querySelector('.ml'); if(ml){ml.style.cursor='pointer'; ml.title='\u05dc\u05e2\u05de\u05d5\u05d3 \u05d4\u05d1\u05d9\u05ea'; ml.addEventListener('click',function(){closeBrand(); window.scrollTo(0,0);});} if(!bar.querySelector('.bp-nav-links')){var nav=document.createElement('div'); nav.className='bp-nav-links'; nav.style.cssText='display:flex;gap:18px;align-items:center;margin-inline-start:auto;margin-inline-end:16px;font-size:14px'; [['\u05e2\u05d1\u05d5\u05d3\u05d5\u05ea','works'],['\u05d0\u05d5\u05d3\u05d5\u05ea','about'],['\u05e7\u05e9\u05e8','contact']].forEach(function(p){var a=document.createElement('a'); a.textContent=p[0]; a.href='#'+p[1]; a.style.cssText='text-decoration:none;color:inherit;font-weight:600;cursor:pointer;opacity:.85'; a.addEventListener('click',function(e){e.preventDefault(); closeBrand(); var el=document.getElementById(p[1]); if(el) window.scrollTo(0, el.offsetTop-70);}); nav.appendChild(a);}); bar.insertBefore(nav, bar.querySelector('.bp-close'));}})();
  document.getElementById('bp-prev').addEventListener('click',()=>{const i=M.works.indexOf(curWork),n=M.works.length;openBrand(M.works[(i-1+n)%n]);});
  document.getElementById('bp-next').addEventListener('click',()=>{const i=M.works.indexOf(curWork),n=M.works.length;openBrand(M.works[(i+1)%n]);});

  const lb=document.getElementById('lb'), lbImg=document.getElementById('lb-img'), lbCount=document.getElementById('lb-count'); let li=0;
  function openLB(i){ li=i; renderLB(); lb.classList.add('open'); }
  function renderLB(){ const im=curWork.images; lbImg.src=im[li]; lbCount.textContent=`${li+1} / ${im.length}`; const m=im.length>1; document.getElementById('lb-prev').style.display=m?'grid':'none'; document.getElementById('lb-next').style.display=m?'grid':'none'; }
  function closeLB(){ lb.classList.remove('open'); }
  document.getElementById('lb-next').addEventListener('click',e=>{e.stopPropagation(); li=(li+1)%curWork.images.length; renderLB();});
  document.getElementById('lb-prev').addEventListener('click',e=>{e.stopPropagation(); li=(li-1+curWork.images.length)%curWork.images.length; renderLB();});
  document.getElementById('lb-x').addEventListener('click',closeLB);
  lb.addEventListener('click',e=>{ if(e.target===lb) closeLB(); });
  addEventListener('keydown',e=>{
    if(e.key==='Escape'){ if(lb.classList.contains('open'))closeLB(); else closeBrand(); }
    if(lb.classList.contains('open')&&curWork){
      if(e.key==='ArrowRight'){ li=(li-1+curWork.images.length)%curWork.images.length; renderLB(); }
      if(e.key==='ArrowLeft'){ li=(li+1)%curWork.images.length; renderLB(); }
    }
  });

  const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target);}}),{threshold:.1});
  document.querySelectorAll('.reveal').forEach(el=>io.observe(el));
  requestAnimationFrame(()=>document.querySelector('.hero-photo').classList.add('in'));
  const nav=document.getElementById('nav'); addEventListener('scroll',()=>nav.classList.toggle('scrolled',scrollY>30));
  (function(){const s=document.getElementById('dswitch'),t=document.getElementById('ds-toggle');if(s&&t){t.addEventListener('click',e=>{e.stopPropagation();s.classList.toggle('open');});document.addEventListener('click',()=>s.classList.remove('open'));}})();
</script>
</body>
</html>
