<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MISHA ● STUDIO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Secular+One&family=Heebo:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{ --bg:#0c0c0d; --bg2:#161618; --ink:#f3f0e9; --soft:#9a978f; --line:#2a2a2c; --acid:#e9ff3d; }
  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{font-family:'Heebo',system-ui,sans-serif; background:var(--bg); color:var(--ink); overflow-x:hidden; -webkit-font-smoothing:antialiased; line-height:1.55}
  ::selection{background:var(--acid); color:#000}
  img{display:block}
  h1,h2,h3,.disp{font-family:'Secular One',sans-serif; font-weight:400; letter-spacing:0}
  .wrap{padding:0 clamp(16px,4vw,40px)}

  nav{position:fixed; inset:0 0 auto 0; z-index:60; display:flex; align-items:center; justify-content:space-between; padding:12px clamp(16px,4vw,40px); background:var(--bg); border-bottom:2px solid var(--ink)}
  .logo-mark{height:40px; mix-blend-mode:screen; cursor:pointer}
  .brandwrap{display:flex; align-items:center; gap:13px}
  .design-switch{position:relative}
  .design-name{font-size:13px; font-weight:700; color:var(--soft); letter-spacing:.06em; text-transform:uppercase; padding-inline-start:13px; border-inline-start:1px solid var(--line); display:inline-flex; align-items:center; gap:7px; cursor:pointer; background:none; border-top:none; border-bottom:none; border-right:none; font-family:inherit}
  .design-name:hover{color:var(--acid)}
  .ds-caret{font-size:9px; transition:transform .25s}
  .design-switch.open .ds-caret{transform:rotate(180deg)}
  .ds-menu{position:absolute; top:calc(100% + 14px); inset-inline-start:0; min-width:236px; background:var(--bg2); border:2px solid var(--ink); padding:8px; display:flex; flex-direction:column; gap:2px; opacity:0; visibility:hidden; transform:translateY(-8px); transition:opacity .22s ease, transform .22s ease; box-shadow:0 26px 56px -20px rgba(0,0,0,.7); z-index:80}
  .design-switch.open .ds-menu{opacity:1; visibility:visible; transform:none}
  .ds-menu .ds-head{font-size:11px; letter-spacing:.2em; text-transform:uppercase; color:var(--soft); padding:8px 12px 5px}
  .ds-menu a{text-decoration:none; color:var(--ink); font-size:14px; font-weight:700; padding:11px 13px; display:flex; align-items:center; justify-content:space-between; gap:10px; transition:.16s; border:1px solid transparent}
  .ds-menu a:hover{background:var(--acid); color:#000}
  .ds-menu a.cur{color:var(--acid)}
  .ds-menu a.cur:hover{color:#000}
  .ds-menu a.cur::after{content:"●"; font-size:8px}
  .ds-menu .ds-divider{height:2px; background:var(--ink); margin:6px 2px}
  .ds-menu a.home{color:var(--soft); font-weight:500; font-size:13px}
  .nlinks{display:flex; gap:clamp(10px,2vw,26px); align-items:center; font-weight:700; font-size:14px; text-transform:uppercase; letter-spacing:.06em}
  .nlinks a{color:var(--ink); text-decoration:none; transition:.2s; padding:4px 2px}
  .nlinks a:hover{color:var(--acid)}
  .nlinks a.back{color:var(--soft); font-weight:500; text-transform:none; letter-spacing:0}

  .hero{position:relative; min-height:96svh; display:flex; flex-direction:column; padding:104px clamp(16px,4vw,40px) 48px; overflow:hidden}
  .hero>*{position:relative; z-index:1}
  .hero .hero-bg{position:absolute; left:0; right:0; top:-34%; height:168%; width:100%; object-fit:cover; object-position:center 26%; z-index:0; will-change:transform}
  .hero .hero-shade{position:absolute; inset:0; background:linear-gradient(0deg, rgba(12,12,13,.97), rgba(12,12,13,.42) 50%, rgba(12,12,13,.12)); z-index:0}
  .hero .eyebrow{display:flex; gap:14px; align-items:center; font-weight:700; font-size:13px; letter-spacing:.24em; text-transform:uppercase; color:var(--ink); margin-bottom:0; text-shadow:0 2px 14px rgba(0,0,0,.7)}
  .hero .eyebrow .ln{height:1px; flex:1; background:rgba(243,240,233,.38)}
  .hero .hero-body{margin-top:auto}
  .hero h1{font-size:clamp(50px,13vw,210px); line-height:.84; text-shadow:0 8px 44px rgba(0,0,0,.55)}
  .hero h1 .acid{color:var(--acid)}
  .hero h1 .out{color:transparent; -webkit-text-stroke:2px var(--ink)}
  .hero .deck{display:flex; justify-content:flex-start; align-items:flex-end; gap:30px; margin-top:clamp(20px,3.5vh,38px); flex-wrap:wrap}
  .hero .deck .txt{max-width:46ch}
  .hero .deck .txt .hi{font-family:'Secular One'; font-size:clamp(20px,2.2vw,30px); margin-bottom:10px; text-shadow:0 2px 16px rgba(0,0,0,.7)}
  .hero .deck .txt p{color:#d8d5cd; font-size:clamp(15px,1.4vw,18px); text-shadow:0 2px 14px rgba(0,0,0,.85)}
  .hero .deck .txt p b{color:var(--acid); font-weight:700}

  .marquee{border-top:2px solid var(--ink); border-bottom:2px solid var(--ink); overflow:hidden; white-space:nowrap; background:var(--acid); color:#000}
  .marquee .track{display:inline-flex; gap:34px; padding:12px 0; animation:slide 28s linear infinite; font-family:'Secular One'; font-size:clamp(18px,2.4vw,30px)}
  .marquee .track span{display:inline-flex; gap:34px; align-items:center}
  @keyframes slide{to{transform:translateX(50%)}}

  .sec{padding:clamp(42px,6vh,82px) clamp(16px,4vw,40px); border-bottom:2px solid var(--ink)}
  .sechead{display:flex; align-items:center; gap:16px; margin-bottom:clamp(22px,3.5vh,40px)}
  .sechead .tag{font-weight:900; font-size:13px; letter-spacing:.2em; text-transform:uppercase; background:var(--ink); color:var(--bg); padding:5px 12px}
  .sechead .ln{flex:1; height:2px; background:var(--ink)}

  #about .stmt{font-family:'Secular One'; font-size:clamp(26px,4.6vw,66px); line-height:1.08; max-width:22ch}
  #about .stmt .acid{color:var(--acid)}
  #about .more{margin-top:clamp(20px,3vh,36px); display:grid; grid-template-columns:repeat(2,1fr); gap:clamp(18px,3vw,42px); max-width:940px}
  #about .more p{color:var(--soft); font-size:clamp(15px,1.4vw,18px); line-height:1.8}

  /* WORKS — logo cells */
  .wgrid{display:grid; grid-template-columns:repeat(3,1fr); gap:0; border-top:2px solid var(--ink); border-inline-start:2px solid var(--ink)}
  .cell{position:relative; border-inline-end:2px solid var(--ink); border-bottom:2px solid var(--ink); aspect-ratio:1/1; cursor:pointer; overflow:hidden; background:var(--bg); transition:background .3s}
  .cell .logowrap{position:absolute; inset:0; background:#fff; display:grid; place-items:center; padding:16%; transition:transform .5s cubic-bezier(.2,.7,.2,1)}
  .cell .logowrap img{max-width:100%; max-height:100%; object-fit:contain}
  .cell .logowrap .txtlogo{font-family:'Secular One'; font-size:clamp(24px,3vw,44px); text-align:center}
  .cell:hover .logowrap{transform:scale(.92)}
  .cell .ov{position:absolute; inset:auto 0 0 0; background:var(--bg); border-top:2px solid var(--acid); padding:14px 16px; transform:translateY(101%); transition:.4s}
  .cell:hover .ov{transform:none}
  .cell .ov .brand{font-weight:900; font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--acid); margin-bottom:3px}
  .cell .ov .t{font-family:'Secular One'; font-size:clamp(15px,1.5vw,20px); line-height:1.1}
  .cell .num{position:absolute; top:10px; inset-inline-end:12px; font-family:'Secular One'; font-size:14px; color:var(--ink); background:var(--bg); border:1px solid var(--line); padding:1px 7px; z-index:2}
  .cell:hover{background:var(--acid)}

  #contact{text-align:center}
  #contact .huge{font-family:'Secular One'; font-size:clamp(46px,11vw,160px); line-height:.9}
  #contact .huge .acid{color:var(--acid)}
  #contact .huge .out{color:transparent; -webkit-text-stroke:1.5px var(--ink)}
  #contact .btns{margin-top:clamp(24px,4vh,42px); display:flex; gap:14px; justify-content:center; flex-wrap:wrap}
  #contact .btns a{font-weight:900; text-transform:uppercase; letter-spacing:.06em; font-size:15px; text-decoration:none; padding:16px 30px; border:2px solid var(--ink); color:var(--ink); transition:.25s}
  #contact .btns a.fill{background:var(--acid); color:#000; border-color:var(--acid)}
  #contact .btns a:hover{background:var(--ink); color:var(--bg)}
  #contact .btns a.fill:hover{background:#000; color:var(--acid)}

  footer{padding:34px clamp(16px,4vw,40px) 48px; text-align:center}
  footer .f{color:var(--soft); font-size:15px; max-width:54ch; margin:0 auto 12px}
  footer .c{font-family:'Secular One'; font-size:13px; letter-spacing:.06em; color:var(--soft)}

  .reveal{opacity:0; transform:translateY(30px); transition:.7s cubic-bezier(.2,.7,.2,1)}
  .reveal.in{opacity:1; transform:none}

  /* BRAND PAGE */
  .brandpage{position:fixed; inset:0; z-index:120; background:var(--bg); display:none; overflow-y:auto}
  .brandpage.open{display:block; animation:vf .35s}
  @keyframes vf{from{opacity:0}to{opacity:1}}
  .bp-bar{position:sticky; top:0; z-index:3; background:var(--bg); border-bottom:2px solid var(--ink); display:flex; justify-content:space-between; align-items:center; padding:11px clamp(16px,4vw,40px)}
  .bp-bar .ml{height:34px; mix-blend-mode:screen}
  .bp-close{font-weight:900; text-transform:uppercase; letter-spacing:.06em; font-size:14px; background:var(--acid); color:#000; border:none; padding:11px 20px; cursor:pointer; font-family:'Heebo'}
  .bp-close:hover{background:var(--ink); color:var(--bg)}
  .bp-head{padding:clamp(26px,4vh,48px) clamp(16px,4vw,40px) clamp(20px,3vh,34px); border-bottom:2px solid var(--ink); display:grid; grid-template-columns:auto 1fr; gap:clamp(22px,3.5vw,44px); align-items:center}
  .bp-logo{width:clamp(120px,15vw,180px); aspect-ratio:1/1; background:#fff; display:grid; place-items:center; padding:16px; flex:none; border:2px solid var(--ink)}
  .bp-logo img{max-width:100%; max-height:100%; object-fit:contain}
  .bp-head .cat{font-weight:900; font-size:13px; letter-spacing:.16em; text-transform:uppercase; color:var(--acid); margin-bottom:12px}
  .bp-head h3{font-family:'Secular One'; font-size:clamp(34px,7vw,96px); line-height:.94}
  .bp-head p{margin-top:18px; color:var(--soft); font-size:clamp(16px,1.5vw,21px); line-height:1.7; max-width:60ch}
  .bp-ads{padding:clamp(20px,3vw,40px); display:grid; gap:clamp(14px,1.8vw,22px); max-width:1200px; margin:0 auto}
  .bp-ads.col3{grid-template-columns:repeat(3,1fr)} .bp-ads.col2{grid-template-columns:repeat(2,1fr)}
  .ad{background:var(--bg2); border:2px solid var(--line); cursor:zoom-in; overflow:hidden; transition:border-color .3s, transform .4s}
  .ad:hover{border-color:var(--acid); transform:translateY(-4px)}
  .ad img{width:100%; height:auto}
  .bp-nav{display:grid; grid-template-columns:1fr 1fr; border-top:2px solid var(--ink)}
  .bp-nav .bp-nav-btn{display:flex; flex-direction:column; gap:6px; padding:clamp(24px,4vh,48px) clamp(16px,4vw,40px); background:var(--bg); border:none; cursor:pointer; font-family:'Heebo'; text-align:start; transition:.25s; color:var(--ink)}
  .bp-nav .next{border-inline-start:2px solid var(--ink); text-align:end; align-items:flex-end}
  .bp-nav .bp-nav-btn:hover{background:var(--acid); color:#000}
  .bp-nav .lbl{font-weight:700; font-size:12px; letter-spacing:.2em; text-transform:uppercase; color:var(--soft)}
  .bp-nav .bp-nav-btn:hover .lbl{color:#000}
  .bp-nav .nt{font-family:'Secular One'; font-size:clamp(20px,3.5vw,42px)}
  @media(max-width:560px){ .bp-nav{grid-template-columns:1fr} .bp-nav .next{border-inline-start:none; border-top:2px solid var(--ink)} }

  /* LIGHTBOX */
  .lb{position:fixed; inset:0; z-index:140; background:rgba(8,8,9,.96); display:none; align-items:center; justify-content:center}
  .lb.open{display:flex; animation:vf .3s}
  .lb img{max-width:92vw; max-height:88vh; width:auto; height:auto; object-fit:contain; border:2px solid var(--line)}
  .lb-x{position:fixed; top:18px; inset-inline-start:22px; width:48px; height:48px; border:2px solid var(--acid); background:none; color:var(--acid); cursor:pointer; font-size:20px}
  .lb-x:hover{background:var(--acid); color:#000}
  .lb-arrow{position:fixed; top:50%; transform:translateY(-50%); width:56px; height:56px; border:2px solid rgba(255,255,255,.3); background:rgba(255,255,255,.06); color:#fff; cursor:pointer; font-size:26px; display:grid; place-items:center}
  .lb-arrow:hover{border-color:var(--acid); color:var(--acid)}
  .lb-prev{right:20px} .lb-next{left:20px}
  .lb-count{position:fixed; bottom:20px; left:50%; transform:translateX(-50%); color:var(--acid); font-family:'Secular One'; font-size:15px; direction:ltr}

  @media(max-width:900px){ .wgrid{grid-template-columns:repeat(2,1fr)} }
  @media(max-width:760px){ #about .more{grid-template-columns:1fr} .nlinks .hide-sm{display:none} .design-name{display:none} .hero h1{font-size:clamp(48px,16vw,90px)} .bp-head{grid-template-columns:1fr} .bp-ads.col3,.bp-ads.col2{grid-template-columns:1fr 1fr} }
  @media(max-width:520px){ .wgrid{grid-template-columns:1fr} .bp-ads.col3,.bp-ads.col2{grid-template-columns:1fr} }
</style>
</head>
<body>

<nav>
  <div class="brandwrap">
    <img class="logo-mark" src="assets/logo-white.png" alt="MISHA Graphics" onclick="location.href='#top'">
    <div class="design-switch" id="dswitch">
      <button class="design-name" id="ds-toggle" type="button">סטודיו ברוטליסטי <span class="ds-caret">▾</span></button>
      <div class="ds-menu">
        <span class="ds-head">העיצובים</span>
        <a href="design-1-gallery.html">גלריה מינימליסטית</a>
        <a href="design-2-poster.html">קיר פוסטרים</a>
        <a href="design-3-brutalist.html" class="cur">סטודיו ברוטליסטי</a>
        <a href="design-4-lab.html">זכוכית</a>
        <a href="design-5-particles.html">חלקיקים</a>
        <a href="design-6-luxe.html">יוקרה מודרנית</a>
        <a href="design-7-kinetic.html">קינטי</a>
        <a href="design-8-riso.html">ריזוגרף</a>
        <a href="design-9-cinema.html">קולנועי</a>
        <div class="ds-divider"></div>
        <a href="index.html" class="home">↩ עמוד הבחירה</a>
      </div>
    </div>
  </div>
  <div class="nlinks">
    <a href="#works">עבודות</a>
    <a href="#about" class="hide-sm">אודות</a>
    <a href="#contact">קשר</a>
  </div>
</nav>

<a id="top"></a>
<section class="hero" data-screen-label="Hero">
  <img class="hero-bg" src="assets/misha-studio.png" alt="מישה בסטודיו">
  <div class="hero-shade"></div>
  <div class="eyebrow"><span>ART DIRECTION</span><span class="ln"></span><span id="eb-year"></span></div>
  <div class="hero-body">
    <h1>רעיונות<br><span class="out">שגורמים</span><br>ל<span class="acid">עצור.</span></h1>
    <div class="deck">
      <div class="txt reveal"><div class="hi" id="hi"></div><p id="hp"></p></div>
    </div>
  </div>
</section>

<div class="marquee"><div class="track" id="track"></div></div>

<section class="sec" id="about" data-screen-label="אודות">
  <div class="sechead"><span class="tag">01 · אודות</span><span class="ln"></span></div>
  <div class="stmt reveal" id="stmt"></div>
  <div class="more reveal" id="more"></div>
</section>

<section class="sec" id="works" data-screen-label="עבודות" style="padding-bottom:0">
  <div class="sechead"><span class="tag">02 · תיק עבודות</span><span class="ln"></span></div>
  <div class="stmt reveal" id="w-intro" style="font-size:clamp(20px,3vw,40px);max-width:28ch;margin-bottom:clamp(28px,4vh,46px)"></div>
  <div class="wgrid" id="wgrid"></div>
</section>

<section class="sec" id="contact" data-screen-label="קשר">
  <div class="sechead"><span class="tag">03 · צרו קשר</span><span class="ln"></span></div>
  <div class="huge reveal" id="c-huge"></div>
  <div class="btns reveal">
    <a class="fill" id="c-mail" href="#">כתבו לי ✉</a>
    <a id="c-ig" href="#">אינסטגרם</a>
    <a id="c-tel" href="#">טלפון</a>
  </div>
</section>

<footer>
  <p class="f" id="foot"></p>
  <p class="c">© <span id="yr"></span> MISHA GRAPHICS</p>
</footer>

<div class="brandpage" id="bp">
  <div class="bp-bar"><img class="ml" src="assets/logo-white.png" alt="MISHA"><button class="bp-close" id="bp-close">סגור ✕</button></div>
  <div class="bp-head">
    <div class="bp-logo" id="bp-logo"></div>
    <div><div class="cat" id="bp-cat"></div><h3 id="bp-title"></h3><p id="bp-desc"></p></div>
  </div>
  <div class="bp-ads" id="bp-ads"></div>
  <div class="bp-nav">
    <button class="bp-nav-btn prev" id="bp-prevbtn" type="button"><span class="lbl">→ העבודה הקודמת</span><span class="nt" id="bp-prev-t"></span></button>
    <button class="bp-nav-btn next" id="bp-nextbtn" type="button"><span class="lbl">העבודה הבאה ←</span><span class="nt" id="bp-next-t"></span></button>
  </div>
</div>

<div class="lb" id="lb">
  <button class="lb-x" id="lb-x">✕</button>
  <button class="lb-arrow lb-prev" id="lb-prev">‹</button>
  <img id="lb-img" src="" alt="">
  <button class="lb-arrow lb-next" id="lb-next">›</button>
  <div class="lb-count" id="lb-count"></div>
</div>

<script src="assets/works.js"></script>
<script>
  const M=window.MISHA, yr=new Date().getFullYear();
  M.works.forEach(w=>{ w.logo=`assets/works/${w.id}/cover.png`; });

  document.getElementById('yr').textContent=yr;
  document.getElementById('eb-year').textContent=yr+' / תל אביב';
  document.getElementById('hi').textContent=M.hero.hello;
  document.getElementById('hp').innerHTML=`${M.hero.lines[0]} ${M.hero.lines[1]} <b>${M.hero.lines[2]}</b><br>${M.hero.sub}`;
  document.getElementById('stmt').innerHTML=`לוקח בריף, מפרק אותו, <span class="acid">ומרכיב מחדש</span> משהו שעוצרים בשבילו.`;
  document.getElementById('more').innerHTML=M.about.body.map(p=>`<p>${p}</p>`).join('');
  document.getElementById('w-intro').innerHTML=`${M.worksIntro.title} <span class="acid">${M.worksIntro.sub}</span>`;
  document.getElementById('c-huge').innerHTML=`<span class="out">בואו</span> <span class="acid">נדבר.</span>`;
  document.getElementById('c-mail').href='mailto:'+M.contact.email;
  document.getElementById('c-ig').href='https://instagram.com/'+M.contact.instagram.replace('@','');
  document.getElementById('c-tel').href='tel:'+M.contact.phone.replace(/-/g,'');
  document.getElementById('foot').textContent=M.footer;

  const brands=M.works.map(w=>w.brand.split(' · ')[0]);
  const one=brands.map(b=>`<span>${b}<span style="font-family:Heebo;font-weight:900">✦</span></span>`).join('');
  document.getElementById('track').innerHTML=one+one;

  const wgrid=document.getElementById('wgrid');
  M.works.forEach((w,i)=>{
    const c=document.createElement('div'); c.className='cell reveal';
    const inner=`<img src="${w.logo}" alt="${w.brand}">`;
    c.innerHTML=`<span class="num">${String(i+1).padStart(2,'0')}</span><div class="logowrap">${inner}</div>
      <div class="ov"><div class="brand">${w.brand}</div><div class="t">${w.title}</div></div>`;
    c.addEventListener('click',()=>openBrand(i));
    wgrid.appendChild(c);
  });

  const bp=document.getElementById('bp'); let cur=0, curWork=null;
  function openBrand(i){
    cur=i; const w=M.works[i]; curWork=w;
    const bl=document.getElementById('bp-logo');
    bl.innerHTML=`<img src="${w.logo}" alt="${w.brand}">`;
    document.getElementById('bp-cat').textContent=`${w.brand} · ${w.category} · ${w.year}`;
    document.getElementById('bp-title').textContent=w.title;
    document.getElementById('bp-desc').textContent=w.desc;
    const ads=document.getElementById('bp-ads');
    ads.className='bp-ads '+(w.orient==='landscape'?'col2':'col3');
    ads.innerHTML=w.images.map((s,idx)=>`<div class="ad" data-i="${idx}"><img src="${s}" alt="${w.title}" loading="lazy"></div>`).join('');
    ads.querySelectorAll('.ad').forEach(a=>a.addEventListener('click',()=>openLB(+a.dataset.i)));
    document.getElementById('bp-prev-t').textContent=M.works[(i-1+M.works.length)%M.works.length].title;
    document.getElementById('bp-next-t').textContent=M.works[(i+1)%M.works.length].title;
    bp.classList.add('open'); document.body.style.overflow='hidden'; bp.scrollTop=0;
  }
  function closeBrand(){ bp.classList.remove('open'); document.body.style.overflow=''; }
  document.getElementById('bp-close').addEventListener('click',closeBrand);
  (function(){var bar=document.querySelector('.bp-bar'); if(!bar) return; var ml=bar.querySelector('.ml'); if(ml){ml.style.cursor='pointer'; ml.title='\u05dc\u05e2\u05de\u05d5\u05d3 \u05d4\u05d1\u05d9\u05ea'; ml.addEventListener('click',function(){closeBrand(); window.scrollTo(0,0);});} if(!bar.querySelector('.bp-nav-links')){var nav=document.createElement('div'); nav.className='bp-nav-links'; nav.style.cssText='display:flex;gap:18px;align-items:center;margin-inline-start:auto;margin-inline-end:16px;font-size:14px'; [['\u05e2\u05d1\u05d5\u05d3\u05d5\u05ea','works'],['\u05d0\u05d5\u05d3\u05d5\u05ea','about'],['\u05e7\u05e9\u05e8','contact']].forEach(function(p){var a=document.createElement('a'); a.textContent=p[0]; a.href='#'+p[1]; a.style.cssText='text-decoration:none;color:inherit;font-weight:600;cursor:pointer;opacity:.85'; a.addEventListener('click',function(e){e.preventDefault(); closeBrand(); var el=document.getElementById(p[1]); if(el) window.scrollTo(0, el.offsetTop-70);}); nav.appendChild(a);}); bar.insertBefore(nav, bar.querySelector('.bp-close'));}})();
  document.getElementById('bp-nextbtn').addEventListener('click',()=>openBrand((cur+1)%M.works.length));
  document.getElementById('bp-prevbtn').addEventListener('click',()=>openBrand((cur-1+M.works.length)%M.works.length));

  const lb=document.getElementById('lb'), lbImg=document.getElementById('lb-img'), lbCount=document.getElementById('lb-count'); let li=0;
  function openLB(i){ li=i; renderLB(); lb.classList.add('open'); }
  function renderLB(){ const im=curWork.images; lbImg.src=im[li]; lbCount.textContent=`${li+1} / ${im.length}`; const m=im.length>1; document.getElementById('lb-prev').style.display=m?'grid':'none'; document.getElementById('lb-next').style.display=m?'grid':'none'; }
  function closeLB(){ lb.classList.remove('open'); }
  document.getElementById('lb-next').addEventListener('click',e=>{e.stopPropagation(); li=(li+1)%curWork.images.length; renderLB();});
  document.getElementById('lb-prev').addEventListener('click',e=>{e.stopPropagation(); li=(li-1+curWork.images.length)%curWork.images.length; renderLB();});
  document.getElementById('lb-x').addEventListener('click',closeLB);
  lb.addEventListener('click',e=>{ if(e.target===lb) closeLB(); });
  addEventListener('keydown',e=>{
    if(e.key==='Escape'){ if(lb.classList.contains('open'))closeLB(); else closeBrand(); }
    if(lb.classList.contains('open')&&curWork){
      if(e.key==='ArrowRight'){ li=(li-1+curWork.images.length)%curWork.images.length; renderLB(); }
      if(e.key==='ArrowLeft'){ li=(li+1)%curWork.images.length; renderLB(); }
    }
  });

  const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target);}}),{threshold:.1});
  document.querySelectorAll('.reveal').forEach(el=>io.observe(el));
  (function(){const s=document.getElementById('dswitch'),t=document.getElementById('ds-toggle');if(s&&t){t.addEventListener('click',e=>{e.stopPropagation();s.classList.toggle('open');});document.addEventListener('click',()=>s.classList.remove('open'));}})();
  (function(){
    const bg=document.querySelector('.hero-bg');
    if(!bg) return;
    if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    let ticking=false;
    const upd=()=>{ const y=window.scrollY||0; if(y < window.innerHeight*1.3){ bg.style.transform='translateY('+(y*0.32).toFixed(1)+'px)'; } ticking=false; };
    addEventListener('scroll',()=>{ if(!ticking){ requestAnimationFrame(upd); ticking=true; } },{passive:true});
  })();
</script>
</body>
</html>
