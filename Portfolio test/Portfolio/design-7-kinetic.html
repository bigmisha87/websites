<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MISHA · קינטי</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Karantina:wght@300;400;700&family=Heebo:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{ --bg:#f0efe9; --ink:#0c0c0c; --soft:#6a6a64; --line:#d6d4ca; --accent:#2222ff; --maxw:1400px; }
  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{font-family:'Heebo',system-ui,sans-serif; background:var(--bg); color:var(--ink); -webkit-font-smoothing:antialiased; line-height:1.55; overflow-x:hidden}
  .disp{font-family:'Karantina',display}
  ::selection{background:var(--accent); color:#fff}
  img{display:block}
  .wrap{max-width:var(--maxw); margin:0 auto; padding:0 clamp(18px,4vw,56px)}

  nav{position:fixed; inset:0 0 auto 0; z-index:60; display:flex; align-items:center; justify-content:space-between; padding:14px clamp(18px,4vw,56px); mix-blend-mode:difference}
  nav .logo-mark{height:30px; filter:invert(1)}
  .brandwrap{display:flex; align-items:center; gap:12px}
  .design-switch{position:relative}
  .design-name{font-family:'Karantina'; font-size:22px; font-weight:700; color:#fff; cursor:pointer; background:none; border:none; display:inline-flex; align-items:center; gap:7px}
  .ds-caret{font-size:11px; font-family:'Heebo'; transition:transform .25s}
  .design-switch.open .ds-caret{transform:rotate(180deg)}
  .ds-menu{position:absolute; top:calc(100% + 12px); inset-inline-start:0; min-width:230px; background:var(--ink); border-radius:6px; padding:8px; display:flex; flex-direction:column; gap:1px; opacity:0; visibility:hidden; transform:translateY(-8px); transition:opacity .24s, transform .24s; z-index:80; mix-blend-mode:normal; font-family:'Heebo'}
  .design-switch.open .ds-menu{opacity:1; visibility:visible; transform:none}
  .ds-menu .ds-head{font-size:11px; letter-spacing:.2em; text-transform:uppercase; color:#888; padding:8px 12px 5px}
  .ds-menu a{text-decoration:none; color:#f0efe9; font-size:14px; font-weight:500; padding:9px 12px; border-radius:4px; display:flex; justify-content:space-between; gap:10px; transition:.15s}
  .ds-menu a:hover{background:var(--accent)}
  .ds-menu a.cur{color:#8c8cff}
  .ds-menu .ds-divider{height:1px; background:#333; margin:5px 4px}
  .ds-menu a.home{color:#888; font-size:13px}
  .nlinks{display:flex; gap:clamp(12px,2vw,26px); align-items:center; font-family:'Heebo'}
  .nlinks a{color:#fff; text-decoration:none; font-weight:600; font-size:14px}

  /* HERO kinetic */
  header.hero{min-height:100svh; display:flex; flex-direction:column; justify-content:center; padding:120px 0 50px; position:relative; overflow:hidden}
  .ticker-bg{position:absolute; top:50%; left:0; white-space:nowrap; font-family:'Karantina'; font-weight:700; font-size:34vh; line-height:1; color:transparent; -webkit-text-stroke:1.5px rgba(12,12,12,.07); transform:translateY(-50%); pointer-events:none; z-index:0}
  .ticker-bg span{display:inline-block; padding-inline-end:.3em; animation:scrollx 30s linear infinite}
  @keyframes scrollx{to{transform:translateX(50%)}}
  .hero-inner{position:relative; z-index:1}
  .hero .kick{font-family:'Heebo'; font-size:13px; letter-spacing:.3em; text-transform:uppercase; color:var(--accent); font-weight:700; margin-bottom:14px; opacity:0; animation:rise .7s .1s forwards}
  .hero h1{font-family:'Karantina'; font-weight:700; font-size:clamp(72px,19vw,300px); line-height:.78; letter-spacing:-.01em}
  .hero h1 .ln{display:block; overflow:hidden}
  .hero h1 .ln i{display:block; font-style:normal; transform:translateY(105%); animation:rise .9s forwards}
  .hero h1 .ln:nth-child(1) i{animation-delay:.12s} .hero h1 .ln:nth-child(2) i{animation-delay:.24s}
  @keyframes rise{to{transform:translateY(0); opacity:1}}
  .hero .rot{color:var(--accent)}
  .hero .sub{font-family:'Heebo'; margin-top:24px; max-width:48ch; font-size:clamp(16px,1.5vw,21px); color:var(--soft); line-height:1.6; opacity:0; animation:rise .7s .5s forwards}
  .hero .sub b{color:var(--ink); font-weight:700}

  .marquee{border-top:2px solid var(--ink); border-bottom:2px solid var(--ink); overflow:hidden; white-space:nowrap; background:var(--ink); color:var(--bg)}
  .marquee .t{display:inline-flex; gap:30px; padding:12px 0; font-family:'Karantina'; font-weight:400; font-size:clamp(22px,3.4vw,40px); animation:scrollx2 22s linear infinite}
  .marquee .t span{display:inline-flex; gap:30px; align-items:center}
  @keyframes scrollx2{to{transform:translateX(50%)}}

  .sec{padding:clamp(56px,9vh,120px) 0}
  .sec-title{font-family:'Karantina'; font-weight:700; font-size:clamp(40px,7vw,120px); line-height:.85; letter-spacing:-.01em; margin-bottom:clamp(24px,4vh,46px)}
  .sec-title .accent{color:var(--accent)}

  #about{display:grid; grid-template-columns:1fr 1fr; gap:clamp(28px,5vw,80px); align-items:end}
  #about .big{font-family:'Karantina'; font-weight:700; font-size:clamp(34px,5vw,76px); line-height:.9}
  #about p{font-family:'Heebo'; color:var(--soft); font-size:clamp(16px,1.4vw,20px); line-height:1.75; margin-bottom:14px}
  #about p:first-child{color:var(--ink); font-weight:500}

  /* WORKS kinetic list */
  .wlist{border-top:2px solid var(--ink)}
  .wrow{position:relative; display:flex; align-items:center; justify-content:space-between; gap:20px; padding:clamp(14px,2.4vh,26px) 8px; border-bottom:2px solid var(--ink); cursor:pointer; overflow:hidden}
  .wrow .fill{position:absolute; inset:0; background:var(--accent); transform:translateY(101%); transition:transform .4s cubic-bezier(.5,0,.2,1); z-index:0}
  .wrow:hover .fill{transform:translateY(0)}
  .wrow > *{position:relative; z-index:1; transition:color .35s}
  .wrow:hover *{color:#fff}
  .wrow .idx{font-family:'Heebo'; font-weight:700; font-size:14px; color:var(--soft); width:46px}
  .wrow .name{font-family:'Karantina'; font-weight:700; font-size:clamp(30px,5.4vw,76px); line-height:.9; flex:1}
  .wrow .name small{display:block; font-family:'Heebo'; font-weight:400; font-size:clamp(12px,1.1vw,15px); color:var(--soft); margin-top:4px}
  .wrow:hover .name small{color:rgba(255,255,255,.8)}
  .wrow .meta{font-family:'Heebo'; font-size:13px; color:var(--soft); text-align:left; white-space:nowrap}
  .wrow .arr{font-family:'Heebo'; font-size:24px; opacity:0; transform:translateX(10px); transition:.35s}
  .wrow:hover .arr{opacity:1; transform:none}
  .peek{position:fixed; z-index:55; width:230px; pointer-events:none; opacity:0; transform:translate(-50%,-50%) scale(.9); transition:opacity .25s, transform .25s; box-shadow:0 30px 60px rgba(0,0,0,.4); border:6px solid #fff}
  .peek img{width:100%; display:block}
  .peek.show{opacity:1; transform:translate(-50%,-50%) scale(1) rotate(-3deg)}

  #contact{text-align:center}
  #contact .big{font-family:'Karantina'; font-weight:700; font-size:clamp(46px,11vw,170px); line-height:.82}
  #contact .big .accent{color:var(--accent)}
  #contact .acts{font-family:'Heebo'; margin-top:30px; display:flex; gap:12px; justify-content:center; flex-wrap:wrap}
  #contact .acts a{text-decoration:none; font-weight:700; font-size:15px; padding:15px 30px; border:2px solid var(--ink); border-radius:0; transition:.25s; color:var(--ink)}
  #contact .acts a:hover{background:var(--ink); color:var(--bg)}
  #contact .acts a.solid{background:var(--accent); color:#fff; border-color:var(--accent)} #contact .acts a.solid:hover{background:var(--ink); border-color:var(--ink)}

  footer{font-family:'Heebo'; border-top:2px solid var(--ink); padding:30px 0; text-align:center}
  footer .f{color:var(--soft); font-size:14px; max-width:50ch; margin:0 auto 10px}
  footer .c{font-size:12px; color:var(--soft); letter-spacing:.08em}

  .reveal{opacity:0; transform:translateY(26px); transition:.8s cubic-bezier(.2,.7,.2,1)}
  .reveal.in{opacity:1; transform:none}

  /* brand page */
  .brandpage{position:fixed; inset:0; z-index:120; background:var(--bg); display:none; overflow-y:auto}
  .brandpage.open{display:block; animation:fade .35s}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .bp-bar{position:sticky; top:0; z-index:3; display:flex; align-items:center; justify-content:space-between; padding:13px clamp(18px,4vw,56px); background:var(--bg); border-bottom:2px solid var(--ink)}
  .bp-bar .ml{height:28px}
  .bp-close{font-family:'Heebo'; font-weight:700; font-size:13px; border:2px solid var(--ink); background:none; cursor:pointer; padding:9px 18px; transition:.25s}
  .bp-close:hover{background:var(--ink); color:var(--bg)}
  .bp-head{max-width:var(--maxw); margin:0 auto; padding:clamp(30px,5vh,60px) clamp(18px,4vw,56px) clamp(20px,3vh,38px); display:grid; grid-template-columns:auto 1fr; gap:clamp(22px,4vw,48px); align-items:center}
  .bp-logo{width:clamp(110px,14vw,170px); aspect-ratio:1/1; background:#fff; border:2px solid var(--ink); display:grid; place-items:center; padding:16px; flex:none}
  .bp-logo img{max-width:100%; max-height:100%; object-fit:contain}
  .bp-head .cat{font-family:'Heebo'; font-size:12px; letter-spacing:.2em; text-transform:uppercase; color:var(--accent); font-weight:700; margin-bottom:10px}
  .bp-head h3{font-family:'Karantina'; font-weight:700; font-size:clamp(40px,7vw,96px); line-height:.85}
  .bp-head p{font-family:'Heebo'; color:var(--soft); font-size:clamp(16px,1.4vw,20px); line-height:1.7; max-width:60ch; margin-top:12px}
  .bp-ads{max-width:var(--maxw); margin:0 auto; padding:0 clamp(18px,4vw,56px) clamp(28px,4vh,46px); display:grid; gap:clamp(14px,1.8vw,24px)}
  .bp-ads.col3{grid-template-columns:repeat(3,1fr)} .bp-ads.col2{grid-template-columns:repeat(2,1fr)}
  .ad{border:2px solid var(--ink); overflow:hidden; cursor:zoom-in; background:#fff; transition:transform .3s}
  .ad:hover{transform:translateY(-5px)}
  .ad img{width:100%; height:auto}
  .bp-nav{max-width:var(--maxw); margin:0 auto; padding:0 clamp(18px,4vw,56px) clamp(50px,7vh,90px); display:grid; grid-template-columns:1fr 1fr; gap:clamp(12px,2vw,20px)}
  .bp-nav .bp-nav-btn{font-family:'Heebo'; display:flex; flex-direction:column; gap:6px; padding:18px 24px; border:2px solid var(--ink); background:none; cursor:pointer; text-align:start; transition:.25s; color:var(--ink)}
  .bp-nav .bp-nav-btn:hover{background:var(--accent); color:#fff; border-color:var(--accent)}
  .bp-nav .dir{font-size:12px; letter-spacing:.1em; font-weight:700}
  .bp-nav .nt{font-family:'Karantina'; font-weight:700; font-size:clamp(22px,3vw,40px); line-height:.95}
  .bp-nav .next{text-align:end; align-items:flex-end}

  .lb{position:fixed; inset:0; z-index:140; background:rgba(12,12,12,.92); display:none; align-items:center; justify-content:center}
  .lb.open{display:flex; animation:fade .3s}
  .lb img{max-width:92vw; max-height:88vh; width:auto; height:auto; object-fit:contain; border:4px solid #fff}
  .lb-x{position:fixed; top:18px; inset-inline-start:22px; width:46px; height:46px; border:2px solid #fff; background:none; color:#fff; cursor:pointer; font-size:20px}
  .lb-x:hover{background:var(--accent); border-color:var(--accent)}
  .lb-arrow{position:fixed; top:50%; transform:translateY(-50%); width:54px; height:54px; border:2px solid #fff; background:none; color:#fff; cursor:pointer; font-size:24px; display:grid; place-items:center}
  .lb-arrow:hover{background:var(--accent); border-color:var(--accent)}
  .lb-prev{right:20px} .lb-next{left:20px}
  .lb-count{position:fixed; bottom:20px; left:50%; transform:translateX(-50%); color:#fff; font-family:'Karantina'; font-size:22px; direction:ltr}

  @media(max-width:820px){ #about{grid-template-columns:1fr; gap:18px} .wrow .meta{display:none} .nlinks .hide-sm{display:none} .peek{display:none} .bp-head{grid-template-columns:1fr} .bp-ads.col3,.bp-ads.col2{grid-template-columns:1fr 1fr} }
  @media(max-width:560px){ .bp-ads.col3,.bp-ads.col2{grid-template-columns:1fr} }
</style>
</head>
<body>

<nav id="nav">
  <div class="brandwrap">
    <img class="logo-mark" src="assets/logo-black.png" alt="MISHA" onclick="location.href='#top'">
    <div class="design-switch" id="dswitch">
      <button class="design-name" id="ds-toggle" type="button">קינטי <span class="ds-caret">▾</span></button>
      <div class="ds-menu" id="dsmenu"></div>
    </div>
  </div>
  <div class="nlinks">
    <a href="#works">עבודות</a>
    <a href="#about" class="hide-sm">אודות</a>
    <a href="#contact">קשר</a>
  </div>
</nav>

<a id="top"></a>
<div class="wrap">
  <header class="hero" data-screen-label="Hero">
    <div class="ticker-bg"><span>MISHA · MISHA · MISHA · MISHA · MISHA · </span></div>
    <div class="hero-inner">
      <div class="kick">ART DIRECTION / תל אביב</div>
      <h1 class="disp"><span class="ln"><i>אני מייצר</i></span><span class="ln"><i class="rot" id="rot">רעיונות.</i></span></h1>
      <p class="sub" id="h-sub"></p>
    </div>
  </header>
</div>

<div class="marquee"><div class="t" id="mq"></div></div>

<div class="wrap">
  <section class="sec" id="about" data-screen-label="אודות">
    <div class="reveal"><div class="sec-title disp">קצת<br><span class="accent">עליי.</span></div></div>
    <div class="reveal" id="a-body" style="padding-bottom:10px"></div>
  </section>
</div>

<div class="wrap">
  <section class="sec" id="works" data-screen-label="עבודות">
    <div class="sec-title disp reveal" id="w-title"></div>
    <div class="wlist" id="wlist"></div>
  </section>

  <section class="sec" id="contact" data-screen-label="קשר">
    <div class="big disp reveal" id="c-big"></div>
    <div class="acts reveal">
      <a class="solid" id="c-mail" href="#">כתבו לי</a>
      <a id="c-ig" href="#">אינסטגרם</a>
    </div>
  </section>
</div>

<footer><p class="f" id="foot"></p><p class="c">© <span id="yr"></span> MISHA GRAPHICS</p></footer>

<div class="peek" id="peek"><img id="peek-img" src="" alt=""></div>

<div class="brandpage" id="bp">
  <div class="bp-bar"><img class="ml" src="assets/logo-black.png" alt="MISHA"><button class="bp-close" id="bp-close">סגירה ✕</button></div>
  <div class="bp-head"><div class="bp-logo" id="bp-logo"></div><div><div class="cat" id="bp-cat"></div><h3 class="disp" id="bp-title"></h3><p id="bp-desc"></p></div></div>
  <div class="bp-ads" id="bp-ads"></div>
  <div class="bp-nav">
    <button class="bp-nav-btn prev" id="bp-prev" type="button"><span class="dir">→ הקודמת</span><span class="nt disp" id="bp-prev-t"></span></button>
    <button class="bp-nav-btn next" id="bp-next" type="button"><span class="dir">הבאה ←</span><span class="nt disp" id="bp-next-t"></span></button>
  </div>
</div>

<div class="lb" id="lb">
  <button class="lb-x" id="lb-x">✕</button>
  <button class="lb-arrow lb-prev" id="lb-prev">‹</button>
  <img id="lb-img" src="" alt="">
  <button class="lb-arrow lb-next" id="lb-next">›</button>
  <div class="lb-count" id="lb-count"></div>
</div>

<script src="assets/works.js"></script>
<script src="assets/nav-designs.js"></script>
<script>
  const M=window.MISHA;
  M.works.forEach(w=>{ w.logo=`assets/works/${w.id}/cover.png`; });
  if(window.buildDesignMenu) buildDesignMenu('dsmenu','design-7-kinetic.html');
  document.getElementById('h-sub').innerHTML=`${M.hero.lines[1]} <b>${M.hero.lines[2]}</b> ${M.hero.sub}`;
  document.getElementById('a-body').innerHTML=M.about.body.map(p=>`<p>${p}</p>`).join('');
  document.getElementById('w-title').innerHTML='תיק <span class="accent">עבודות.</span>';
  document.getElementById('c-big').innerHTML=`בואו <span class="accent">נדבר.</span>`;
  document.getElementById('c-mail').href='mailto:'+M.contact.email;
  document.getElementById('c-ig').href='https://instagram.com/'+M.contact.instagram.replace('@','');
  document.getElementById('foot').textContent=M.footer;
  document.getElementById('yr').textContent=new Date().getFullYear();

  // rotating word
  const rotWords=['רעיונות.','קמפיינים.','קונספטים.','מותגים.','בלגן יפה.'];
  let ri=0; const rotEl=document.getElementById('rot');
  setInterval(()=>{ ri=(ri+1)%rotWords.length; rotEl.style.opacity=0; rotEl.style.transform='translateY(-20%)'; setTimeout(()=>{ rotEl.textContent=rotWords[ri]; rotEl.style.transition='none'; rotEl.style.transform='translateY(20%)'; requestAnimationFrame(()=>{ rotEl.style.transition='.4s'; rotEl.style.opacity=1; rotEl.style.transform='translateY(0)'; }); },380); }, 2200);

  // marquee
  const mqItems=['רעיונות','קונספט','קמפיינים','קופי','טיפוגרפיה','בימוי','✦'];
  const one='<span>'+mqItems.join('</span><span>')+'</span>';
  document.getElementById('mq').innerHTML='<span>'+one+one+'</span>';

  // works rows
  const wlist=document.getElementById('wlist');
  M.works.forEach((w,i)=>{
    const r=document.createElement('div'); r.className='wrow'; r.dataset.img=w.images[0];
    r.innerHTML=`<div class="fill"></div><span class="idx">${String(i+1).padStart(2,'0')}</span><span class="name disp">${w.title}<small>${w.brand} · ${w.category}</small></span><span class="meta">${w.year}</span><span class="arr">←</span>`;
    r.addEventListener('click',()=>openBrand(w)); wlist.appendChild(r);
  });
  const peek=document.getElementById('peek'), peekImg=document.getElementById('peek-img');
  if(matchMedia('(hover:hover)').matches){
    document.querySelectorAll('.wrow').forEach(r=>{ r.addEventListener('mouseenter',()=>{peekImg.src=r.dataset.img; peek.classList.add('show');}); r.addEventListener('mouseleave',()=>peek.classList.remove('show')); });
    addEventListener('mousemove',e=>{ peek.style.left=e.clientX+'px'; peek.style.top=e.clientY+'px'; });
  }

  // brand page + lightbox + work-nav
  const bp=document.getElementById('bp'); let curWork=null;
  function openBrand(w){
    curWork=w; peek.classList.remove('show');
    document.getElementById('bp-logo').innerHTML=`<img src="${w.logo}" alt="${w.brand}">`;
    document.getElementById('bp-cat').textContent=`${w.brand} · ${w.category} · ${w.year}`;
    document.getElementById('bp-title').textContent=w.title;
    document.getElementById('bp-desc').textContent=w.desc;
    const ads=document.getElementById('bp-ads'); ads.className='bp-ads '+(w.orient==='landscape'?'col2':'col3');
    ads.innerHTML=w.images.map((s,idx)=>`<div class="ad" data-i="${idx}"><img src="${s}" alt="${w.title}" loading="lazy"></div>`).join('');
    ads.querySelectorAll('.ad').forEach(a=>a.addEventListener('click',()=>openLB(+a.dataset.i)));
    const i=M.works.indexOf(w), n=M.works.length;
    document.getElementById('bp-prev-t').textContent=M.works[(i-1+n)%n].title;
    document.getElementById('bp-next-t').textContent=M.works[(i+1)%n].title;
    bp.classList.add('open'); document.body.style.overflow='hidden'; bp.scrollTop=0;
  }
  function closeBrand(){ bp.classList.remove('open'); document.body.style.overflow=''; }
  document.getElementById('bp-close').addEventListener('click',closeBrand);
  (function(){var bar=document.querySelector('.bp-bar'); if(!bar) return; var ml=bar.querySelector('.ml'); if(ml){ml.style.cursor='pointer'; ml.title='\u05dc\u05e2\u05de\u05d5\u05d3 \u05d4\u05d1\u05d9\u05ea'; ml.addEventListener('click',function(){closeBrand(); window.scrollTo(0,0);});} if(!bar.querySelector('.bp-nav-links')){var nav=document.createElement('div'); nav.className='bp-nav-links'; nav.style.cssText='display:flex;gap:18px;align-items:center;margin-inline-start:auto;margin-inline-end:16px;font-size:14px'; [['\u05e2\u05d1\u05d5\u05d3\u05d5\u05ea','works'],['\u05d0\u05d5\u05d3\u05d5\u05ea','about'],['\u05e7\u05e9\u05e8','contact']].forEach(function(p){var a=document.createElement('a'); a.textContent=p[0]; a.href='#'+p[1]; a.style.cssText='text-decoration:none;color:inherit;font-weight:600;cursor:pointer;opacity:.85'; a.addEventListener('click',function(e){e.preventDefault(); closeBrand(); var el=document.getElementById(p[1]); if(el) window.scrollTo(0, el.offsetTop-70);}); nav.appendChild(a);}); bar.insertBefore(nav, bar.querySelector('.bp-close'));}})();
  document.getElementById('bp-prev').addEventListener('click',()=>{const i=M.works.indexOf(curWork),n=M.works.length;openBrand(M.works[(i-1+n)%n]);});
  document.getElementById('bp-next').addEventListener('click',()=>{const i=M.works.indexOf(curWork),n=M.works.length;openBrand(M.works[(i+1)%n]);});

  const lb=document.getElementById('lb'), lbImg=document.getElementById('lb-img'), lbCount=document.getElementById('lb-count'); let li=0;
  function openLB(i){ li=i; renderLB(); lb.classList.add('open'); }
  function renderLB(){ const im=curWork.images; lbImg.src=im[li]; lbCount.textContent=`${li+1} / ${im.length}`; const m=im.length>1; document.getElementById('lb-prev').style.display=m?'grid':'none'; document.getElementById('lb-next').style.display=m?'grid':'none'; }
  function closeLB(){ lb.classList.remove('open'); }
  document.getElementById('lb-next').addEventListener('click',e=>{e.stopPropagation(); li=(li-1+curWork.images.length)%curWork.images.length; renderLB();});
  document.getElementById('lb-prev').addEventListener('click',e=>{e.stopPropagation(); li=(li+1)%curWork.images.length; renderLB();});
  document.getElementById('lb-x').addEventListener('click',closeLB);
  lb.addEventListener('click',e=>{ if(e.target===lb) closeLB(); });
  addEventListener('keydown',e=>{ if(e.key==='Escape'){ if(lb.classList.contains('open'))closeLB(); else closeBrand(); } if(lb.classList.contains('open')&&curWork){ if(e.key==='ArrowLeft'){li=(li+1)%curWork.images.length;renderLB();} if(e.key==='ArrowRight'){li=(li-1+curWork.images.length)%curWork.images.length;renderLB();} } });

  const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target);}}),{threshold:.12});
  document.querySelectorAll('.reveal').forEach(el=>io.observe(el));
  (function(){const s=document.getElementById('dswitch'),t=document.getElementById('ds-toggle');t.addEventListener('click',e=>{e.stopPropagation();s.classList.toggle('open');});document.addEventListener('click',()=>s.classList.remove('open'));})();
</script>
